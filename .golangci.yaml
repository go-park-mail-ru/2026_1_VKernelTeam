# https://golangci-lint.run/usage/configuration/#config-file
version: "2"
linters:
  disable-all: true
  enable:
    - errcheck
    # - gosimple
    - govet
    - ineffassign
    - unused
    - errname
    # - exhaustive
    - containedctx
    - gocheckcompilerdirectives
    - gochecknoinits
    - goconst
    - gocritic
    - ireturn
    - perfsprint
    - prealloc
    - protogetter
    - sqlclosecheck
    - whitespace
    - revive
    - staticcheck
    - govet
    - forbidigo
    # - tagliatelle

linters-settings:
  forbidigo:
    forbid:
      - p: ^time\.After$
        msg: time.After may leak resources. Use time.NewTimer instead.
  revive:
    severity: error
    confidence: 0.8
    enable-all-rules: true
    rules:
      - name: get-return
        disabled: true
      - name: add-constant
        disabled: true
      - name: exported
        disabled: true
      - name: line-length-limit
        disabled: true
      - name: error-strings
        disabled: true
      - name: cyclomatic
        disabled: true
      # - name: argument-limit
      #   disabled: true
      # - name: bare-return
      #   disabled: true
      # - name: banned-characters
      #   disabled: true
      # - name: bool-literal-in-expr
      #   disabled: true
      # - name: confusing-naming
      #   disabled: true
      # - name: empty-lines
      #   disabled: true
      # - name: error-naming
      #   disabled: true
      # - name: errorf
      #   disabled: true
      # - name: file-header
      #   disabled: true
      # - name: function-length
      #   disabled: true
      # - name: imports-blacklist
      #   disabled: true
      # - name: increment-decrement
      #   disabled: true
      # - name: max-public-structs
      #   disabled: true
      # - name: nested-structs
      #   disabled: true
      # - name: package-comments
      #   disabled: true
      # - name: string-format
      #   disabled: true
      # - name: unexported-naming
      #   disabled: true
      # - name: unexported-return
      #   disabled: true
      # - name: unused-parameter
      #   disabled: true
      # - name: unused-receiver
      #   disabled: true
      # - name: use-any
      #   disabled: true
      # - name: var-naming
      #   disabled: true
      # - name: empty-block
      #   disabled: true
      # - name: flag-parameter
      # disabled: true

      # Rule tuning
      - name: unhandled-error
        arguments:
          - "fmt.*"
          # - "bytes.Buffer.*"
          # - "strings.Builder.*"
