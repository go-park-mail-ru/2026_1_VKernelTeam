name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Отменяем устаревшие прогоны при новом пуше в ту же ветку/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: golangci-lint
        # v7 - версия action, совместимая с golangci-lint v2 (наш .golangci.yaml).
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest          # golangci-lint v2.x
          args: --timeout=5m ./pkg/... ./services/...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true              # кэш go-модулей между прогонами
      - name: Run tests
        run: make test-ci

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true
      - name: Compile all services
        run: |
          make build-auth
          make build-support
          make build-catalog
          make build-commerce

  # Сборка Docker-образов и push в ghcr.io только на push в dev (т.е. PR влит),
  # и только если lint/test/build прошли.
  docker-build-push:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      packages: write          # право пушить в ghcr.io
    strategy:
      matrix:
        service: [auth, support, catalog, commerce]
    steps:
      - uses: actions/checkout@v4
      # Билдер на драйвере docker-container - нужен для кэша type=gha.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployments/Dockerfile.${{ matrix.service }}
          push: true
          # Два тега: мутабельный dev (его тянет VM) и неизменный по SHA коммита (для отката).
          tags: |
            ghcr.io/go-park-mail-ru/2026_1_vkernelteam/${{ matrix.service }}:dev
            ghcr.io/go-park-mail-ru/2026_1_vkernelteam/${{ matrix.service }}:${{ github.sha }}
          # Привязывает пакет к репозиторию: пакет автоматически наследует доступ
          # репозитория, и коллабораторы могут его тянуть без admin-прав на пакет.
          labels: |
            org.opencontainers.image.source=https://github.com/go-park-mail-ru/2026_1_VKernelTeam
          cache-from: type=gha
          cache-to: type=gha,mode=max
