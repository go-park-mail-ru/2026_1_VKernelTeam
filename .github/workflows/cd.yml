name: CD

# Запускается после успешного workflow CI на ветке dev.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [dev]

concurrency:
  group: cd-dev
  cancel-in-progress: false        # деплои не отменяем - дожидаемся

jobs:
  deploy:
    # Деплоим только если CI завершился успехом.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # Сборка 4 Go-сервисов на 1-CPU VPS не укладывается в дефолтные 10m.
          command_timeout: 40m
          script: |
            cd ~/2026_1_VKernelTeam
            make deploy
