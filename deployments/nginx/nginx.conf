upstream monolith {
    server monolith:8000;
}

upstream auth_service {
    server auth:8001;
}

upstream support_service {
    server support:8002;
}

upstream catalog_service {
    server catalog:8004;
}

server {
    listen 80;

    # ──────────────────────────────────────────────
    # Auth Service
    # ──────────────────────────────────────────────

    location /api/v1/auth/ {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /api/v1/profile/favorites живёт в catalog (избранные объявления),
    # exact-match имеет более высокий приоритет, чем prefix /api/v1/profile.
    location = /api/v1/profile/favorites {
        proxy_pass http://catalog_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /api/v1/profile, /api/v1/profile/avatar — на auth
    location /api/v1/profile {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ──────────────────────────────────────────────
    # Catalog Service (объявления, категории, просмотры, избранное)
    # ──────────────────────────────────────────────

    # /api/v1/users/{id}/ads — объявления пользователя
    # ВНИМАНИЕ: regex должен идти ПЕРЕД более общим /users/{id}, иначе nginx
    # выберет первый матчащийся regex по порядку.
    location ~ ^/api/v1/users/[0-9]+/ads$ {
        proxy_pass http://catalog_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /api/v1/users/{id} — публичный профиль (auth)
    location ~ ^/api/v1/users/[0-9]+$ {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Характеристики категорий
    location ~ ^/api/v1/categories/[0-9]+/characteristics$ {
        proxy_pass http://catalog_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Все /api/v1/ads* — catalog (включая GET /ads, /ads/search, /ads/{id},
    # /ads/{id}/view, /ads/{id}/favorite, и т.д.)
    # ^~ запрещает nginx проверять regex после совпадения по prefix.
    location ^~ /api/v1/ads {
        proxy_pass http://catalog_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ──────────────────────────────────────────────
    # Support Service
    # ──────────────────────────────────────────────

    location /api/v1/support/ {
        proxy_pass http://support_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ──────────────────────────────────────────────
    # Монолит (всё остальное: cart, chat, swagger, static)
    # ──────────────────────────────────────────────

    location / {
        proxy_pass http://monolith;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
