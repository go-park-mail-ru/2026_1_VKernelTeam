# JSON access-log: парсится Vector'ом и пишется в ClickHouse logs.gateway_access.
# escape=json валидирует строки как UTF-8 и экранирует управляющие символы.
log_format json_combined escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"query":"$args",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream":"$proxy_host",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

access_log /dev/stdout json_combined;
error_log  /dev/stderr warn;

# WebSocket upgrade: Connection header выставляется в "upgrade" только если
# клиент прислал Upgrade-заголовок, иначе оставляем close. Жёсткий
# "Connection: upgrade" для всех запросов ломает обычный HTTP/1.1 keep-alive
# и Grafana Live (битый WebSocket → ошибки "insecure WebSocket connection"
# в браузере). Используется ниже в /grafana/ и /prometheus/.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Gzip — runtime-сжатие для динамических ответов, gzip_static — для пре-сжатых
# файлов фронтенда, которые webpack кладёт в виде .gz/.br рядом с ассетами.
gzip on;
gzip_static on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/xml+rss
    application/manifest+json
    image/svg+xml
    font/woff2
    font/ttf;

# SSL — Mozilla intermediate (TLS 1.2+1.3), сессионный кэш, OCSP-stapling.
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;

# Upstreams бэкенд-сервисов (доступны по имени контейнера в docker-сети).
upstream auth_service {
    server auth:8001;
}

upstream support_service {
    server support:8002;
}

upstream catalog_service {
    server catalog:8004;
}

upstream commerce_service {
    server commerce:8006;
}

upstream swagger_ui {
    server swagger_ui:8080;
}

upstream grafana_service {
    server grafana:3000;
}

upstream prometheus_service {
    server prometheus:9090;
}

# Общие proxy-заголовки переиспользуются всеми /api/* локациями.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# HTTP :80 — отдаём только ACME-challenge для Let's Encrypt; всё прочее → 301 HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name clover-go.ru _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS :443 + HTTP/2 — единая точка входа: статика SPA + проксирование /api/.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name clover-go.ru;

    ssl_certificate     /etc/letsencrypt/live/clover-go.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clover-go.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/clover-go.ru/chain.pem;

    # HSTS — браузер сам форсит HTTPS после первого визита.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Сквозной request_id: nginx генерирует ($request_id), пробрасывает
    # на upstream и возвращает клиенту. Корреляция с логами Go-сервисов
    # и таблицей logs.gateway_access идёт по этому идентификатору.
    proxy_set_header X-Request-ID $request_id;
    add_header X-Request-ID $request_id always;

    # Раздача фронт-статики. dist/ примонтирован в /usr/share/nginx/html.
    root /usr/share/nginx/html;
    index index.html;

    # Достаточный размер для аплоада фото объявлений/аватарок.
    client_max_body_size 20m;

    # Кэширование статики: длинный immutable для хешированных ассетов,
    # no-cache для HTML/manifest/sw — чтобы пользователи получали свежий index.
    location ~* \.(?:js|css|woff2?|ttf|eot|jpg|jpeg|png|webp|avif|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.svg$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Auth Service
    location /api/v1/auth/ {
        proxy_pass http://auth_service;
    }

    # /api/v1/profile/favorites живёт в catalog (избранные объявления),
    # exact-match имеет более высокий приоритет, чем prefix /api/v1/profile.
    location = /api/v1/profile/favorites {
        proxy_pass http://catalog_service;
    }

    # /api/v1/profile/promotions — история покупок продвижения (commerce).
    location = /api/v1/profile/promotions {
        proxy_pass http://commerce_service;
    }

    # /api/v1/profile, /api/v1/profile/avatar — на auth
    location /api/v1/profile {
        proxy_pass http://auth_service;
    }

    # Catalog Service (объявления, категории, просмотры, избранное)

    # /api/v1/users/{id}/ads — объявления пользователя
    # ВНИМАНИЕ: regex должен идти ПЕРЕД более общим /users/{id}, иначе nginx
    # выберет первый матчащийся regex по порядку.
    location ~ ^/api/v1/users/[0-9]+/ads$ {
        proxy_pass http://catalog_service;
    }

    # /api/v1/users/{id} — публичный профиль (auth)
    location ~ ^/api/v1/users/[0-9]+$ {
        proxy_pass http://auth_service;
    }

    # Список категорий и характеристики категорий
    location = /api/v1/categories {
        proxy_pass http://catalog_service;
    }

    location ~ ^/api/v1/categories/[0-9]+/characteristics$ {
        proxy_pass http://catalog_service;
    }

    # Commerce Service (корзина, чаты, заказы)

    # POST /api/v1/ads/{id}/order создаёт чат+заказ — это commerce, не catalog.
    # Regex имеет приоритет над prefix-локациями ниже, поэтому объявление здесь
    # выше /api/v1/ads перенаправит запрос в commerce_service.
    location ~ ^/api/v1/ads/[0-9]+/order$ {
        proxy_pass http://commerce_service;
    }

    # GET/POST /api/v1/ads/{id}/promotions — продвижение объявлений (commerce).
    location ~ ^/api/v1/ads/[0-9]+/promotions$ {
        proxy_pass http://commerce_service;
    }

    location /api/v1/cart {
        proxy_pass http://commerce_service;
    }

    location /api/v1/chats {
        proxy_pass http://commerce_service;
    }

    # Wallet (commerce): /api/v1/wallet, /api/v1/wallet/transactions, /api/v1/wallet/topup
    location /api/v1/wallet {
        proxy_pass http://commerce_service;
    }

    # Promotion plans (commerce, публично).
    location /api/v1/promotion/ {
        proxy_pass http://commerce_service;
    }

    # Все остальные /api/v1/ads* — catalog (GET /ads, /ads/search, /ads/{id},
    # /ads/{id}/view, /ads/{id}/favorite, /ads/{id}/close).
    # БЕЗ ^~, чтобы regex выше (например /ads/{id}/order) имели приоритет.
    location /api/v1/ads {
        proxy_pass http://catalog_service;
    }

    # Support Service
    location /api/v1/support/ {
        proxy_pass http://support_service;
    }

    # Swagger UI (для фронтов и команды). Читает /spec/swagger.yaml.
    location = /swagger { return 301 /swagger/; }

    location ^~ /swagger/ {
        proxy_pass http://swagger_ui;
    }

    # Grafana — наблюдаемость (метрики/логи). Сервит из подпути /grafana/,
    # см. GF_SERVER_SERVE_FROM_SUB_PATH и GF_SERVER_ROOT_URL в docker-compose.
    # ВАЖНО: proxy_pass БЕЗ trailing slash — Grafana с serve_from_sub_path
    # сама ожидает префикс /grafana/ в запросе. Если поставить слэш, nginx
    # срежет префикс и Grafana вернёт 404.
    # ^~ обязателен: без него regex-локация для .js/.css выше перехватит
    # /grafana/public/build/*.js и попытается отдать их с диска (404).
    location = /grafana { return 301 /grafana/; }

    location ^~ /grafana/ {
        proxy_pass http://grafana_service;
        proxy_http_version 1.1;
        # Live-стримы и встроенные дашборды требуют WebSocket-апгрейда.
        # $connection_upgrade — условный: "upgrade" только для WS-запросов
        # (см. map выше), иначе "close". Жёсткий "upgrade" для всех запросов
        # ломает Grafana Live в браузере.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Grafana 11 CSRF middleware читает X-Forwarded-Host для проверки
        # Origin. Без него POST /api/ds/query из браузера получает 403.
        proxy_set_header X-Forwarded-Host $host;
    }

    # Prometheus — UI и API для проверки targets/метрик. Порт 9090 наружу
    # не публикуется (фаервол VK Cloud открывает только 80/443), доступ
    # только через nginx по https://clover-go.ru/prometheus/.
    # ВАЖНО: proxy_pass СО слэшем — nginx срезает префикс /prometheus/
    # из URI, Prometheus получает запросы как корневые (/api/v1/targets, …).
    # Это требует пары флагов в docker-compose:
    #   --web.external-url=https://clover-go.ru/prometheus/  (для редиректов и UI-ссылок)
    #   --web.route-prefix=/                                  (слушать на корне)
    location = /prometheus { return 301 /prometheus/; }

    location ^~ /prometheus/ {
        proxy_pass http://prometheus_service/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # SPA fallback: любой неизвестный путь без точки в имени отдаёт index.html.
    # Регексы выше для статических расширений срабатывают раньше — это безопасно.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
