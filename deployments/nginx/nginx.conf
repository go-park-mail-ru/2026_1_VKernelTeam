# JSON access-log: парсится Vector'ом и пишется в ClickHouse logs.gateway_access.
# escape=json валидирует строки как UTF-8 и экранирует управляющие символы.
log_format json_combined escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"query":"$args",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream":"$proxy_host",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

access_log /dev/stdout json_combined;
error_log  /dev/stderr warn;

upstream auth_service {
    server auth:8001;
}

upstream support_service {
    server support:8002;
}

upstream catalog_service {
    server catalog:8004;
}

upstream commerce_service {
    server commerce:8006;
}

upstream swagger_ui {
    server swagger_ui:8080;
}

server {
    listen 80;

    # Сквозной request_id: nginx генерирует ($request_id), пробрасывает
    # на upstream и возвращает клиенту. Корреляция с логами Go-сервисов
    # и таблицей logs.gateway_access идёт по этому идентификатору.
    proxy_set_header X-Request-ID $request_id;
    add_header X-Request-ID $request_id always;

    # ──────────────────────────────────────────────
    # Auth Service
    # ──────────────────────────────────────────────

    location /api/v1/auth/ {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /api/v1/profile/favorites живёт в catalog (избранные объявления),
    # exact-match имеет более высокий приоритет, чем prefix /api/v1/profile.
    location = /api/v1/profile/favorites {
        proxy_pass http://catalog_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /api/v1/profile/promotions — история покупок продвижения (commerce).
    location = /api/v1/profile/promotions {
        proxy_pass http://commerce_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /api/v1/profile, /api/v1/profile/avatar — на auth
    location /api/v1/profile {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ──────────────────────────────────────────────
    # Catalog Service (объявления, категории, просмотры, избранное)
    # ──────────────────────────────────────────────

    # /api/v1/users/{id}/ads — объявления пользователя
    # ВНИМАНИЕ: regex должен идти ПЕРЕД более общим /users/{id}, иначе nginx
    # выберет первый матчащийся regex по порядку.
    location ~ ^/api/v1/users/[0-9]+/ads$ {
        proxy_pass http://catalog_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /api/v1/users/{id} — публичный профиль (auth)
    location ~ ^/api/v1/users/[0-9]+$ {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Характеристики категорий
    location ~ ^/api/v1/categories/[0-9]+/characteristics$ {
        proxy_pass http://catalog_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ──────────────────────────────────────────────
    # Commerce Service (корзина, чаты, заказы)
    # ──────────────────────────────────────────────

    # POST /api/v1/ads/{id}/order создаёт чат+заказ — это commerce, не catalog.
    # Regex имеет приоритет над prefix-локациями ниже, поэтому объявление здесь
    # выше /api/v1/ads перенаправит запрос в commerce_service.
    location ~ ^/api/v1/ads/[0-9]+/order$ {
        proxy_pass http://commerce_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # GET/POST /api/v1/ads/{id}/promotions — продвижение объявлений (commerce).
    location ~ ^/api/v1/ads/[0-9]+/promotions$ {
        proxy_pass http://commerce_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/cart {
        proxy_pass http://commerce_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/chats {
        proxy_pass http://commerce_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Wallet (commerce): /api/v1/wallet, /api/v1/wallet/transactions, /api/v1/wallet/topup
    location /api/v1/wallet {
        proxy_pass http://commerce_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Promotion plans (commerce, публично).
    location /api/v1/promotion/ {
        proxy_pass http://commerce_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Все остальные /api/v1/ads* — catalog (GET /ads, /ads/search, /ads/{id},
    # /ads/{id}/view, /ads/{id}/favorite, /ads/{id}/close).
    # БЕЗ ^~, чтобы regex выше (например /ads/{id}/order) имели приоритет.
    location /api/v1/ads {
        proxy_pass http://catalog_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ──────────────────────────────────────────────
    # Support Service
    # ──────────────────────────────────────────────

    location /api/v1/support/ {
        proxy_pass http://support_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ──────────────────────────────────────────────
    # Swagger UI (для фронтов и команды). Читает /spec/swagger.yaml.
    # ──────────────────────────────────────────────

    location = /swagger { return 301 /swagger/; }

    location /swagger/ {
        proxy_pass http://swagger_ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ──────────────────────────────────────────────
    # Всё остальное - 404
    # Все API-роуты обслуживаются auth/support/catalog/commerce выше.
    # ──────────────────────────────────────────────

    location / {
        return 404;
    }
}
