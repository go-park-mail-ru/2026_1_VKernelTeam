# Локальный конфиг gateway: один server на :80 без SSL.
# Используется только для отладки (см. docker-compose.override.yaml).
# В прод-конфиге (nginx.conf) :80 редиректит на HTTPS, а основной server слушает :443.

log_format json_combined escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"query":"$args",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream":"$proxy_host",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

access_log /dev/stdout json_combined;
error_log  /dev/stderr warn;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

gzip on;
gzip_static on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/xml+rss
    application/manifest+json
    image/svg+xml
    font/woff2
    font/ttf;

upstream auth_service {
    server auth:8001;
}

upstream support_service {
    server support:8002;
}

upstream catalog_service {
    server catalog:8004;
}

upstream commerce_service {
    server commerce:8006;
}

upstream swagger_ui {
    server swagger_ui:8080;
}

upstream grafana_service {
    server grafana:3000;
}

upstream prometheus_service {
    server prometheus:9090;
}

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    proxy_set_header X-Request-ID $request_id;
    add_header X-Request-ID $request_id always;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    location ~* \.(?:js|css|woff2?|ttf|eot|jpg|jpeg|png|webp|avif|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.svg$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /api/v1/auth/ {
        proxy_pass http://auth_service;
    }

    location = /api/v1/profile/favorites {
        proxy_pass http://catalog_service;
    }

    location = /api/v1/profile/promotions {
        proxy_pass http://commerce_service;
    }

    # /api/v1/profile/reviews — отзывы, оставленные текущим пользователем (commerce).
    location = /api/v1/profile/reviews {
        proxy_pass http://commerce_service;
    }

    # /api/v1/profile/purchases — покупки текущего пользователя (commerce).
    location = /api/v1/profile/purchases {
        proxy_pass http://commerce_service;
    }

    location /api/v1/profile {
        proxy_pass http://auth_service;
    }

    location ~ ^/api/v1/users/[0-9]+/ads$ {
        proxy_pass http://catalog_service;
    }

    # /api/v1/users/{id}/reviews и /api/v1/users/{id}/reviews/summary — отзывы о пользователе (commerce).
    # Regex должны идти ПЕРЕД более общим /users/{id}, иначе nginx выберет первый матчащийся.
    location ~ ^/api/v1/users/[0-9]+/reviews$ {
        proxy_pass http://commerce_service;
    }

    location ~ ^/api/v1/users/[0-9]+/reviews/summary$ {
        proxy_pass http://commerce_service;
    }

    location ~ ^/api/v1/users/[0-9]+$ {
        proxy_pass http://auth_service;
    }

    # Reviews CRUD (commerce): POST /reviews, PUT/DELETE /reviews/{id}.
    location /api/v1/reviews {
        proxy_pass http://commerce_service;
    }

    location = /api/v1/categories {
        proxy_pass http://catalog_service;
    }

    location ~ ^/api/v1/categories/[0-9]+/characteristics$ {
        proxy_pass http://catalog_service;
    }

    location ~ ^/api/v1/ads/[0-9]+/order$ {
        proxy_pass http://commerce_service;
    }

    location ~ ^/api/v1/ads/[0-9]+/promotions$ {
        proxy_pass http://commerce_service;
    }

    location /api/v1/cart {
        proxy_pass http://commerce_service;
    }

    location /api/v1/chats {
        proxy_pass http://commerce_service;
    }

    location /api/v1/wallet {
        proxy_pass http://commerce_service;
    }

    location /api/v1/promotion/ {
        proxy_pass http://commerce_service;
    }

    location /api/v1/ads {
        proxy_pass http://catalog_service;
    }

    location /api/v1/support/ {
        proxy_pass http://support_service;
    }

    location = /swagger { return 301 /swagger/; }

    location ^~ /swagger/ {
        proxy_pass http://swagger_ui;
    }

    location = /grafana { return 301 /grafana/; }

    location ^~ /grafana/ {
        proxy_pass http://grafana_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /prometheus { return 301 /prometheus/; }

    location ^~ /prometheus/ {
        proxy_pass http://prometheus_service/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
