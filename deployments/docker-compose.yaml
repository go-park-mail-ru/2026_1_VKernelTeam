# Порты сервисов задаются в конфигах services/<name>/config/local.json:
#   auth     → http 8001, grpc 9001
#   support  → http 8002
#   catalog  → http 8004, grpc 9004
#   commerce → http 8006
# При изменении портов в конфигах — обновить port mapping здесь.

services:

  #  API GATEWAY
  gateway:
    image: nginx:1.27-alpine
    container_name: gateway
    ports:
      - "${GATEWAY_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth
      - support
      - catalog
      - commerce
      - swagger-ui
    restart: unless-stopped

  #  Подготовка прав на volume `pglogs`.
  #  Docker создаёт named volume под root, а postgres в alpine
  #  работает под uid/gid 70. Без этого шага сервер падает с
  #  «could not open log file ... Permission denied».
  pglogs_init:
    image: alpine:3.20
    container_name: pglogs_init
    command: ["sh", "-c", "chown -R 70:70 /var/log/postgresql && chmod 0750 /var/log/postgresql"]
    volumes:
      - pglogs:/var/log/postgresql

  #  ОБЩАЯ БД
  #  Кастомная конфигурация лежит в /db (см. db/README.md):
  #    db/config/postgresql.custom.conf — параметры сервера,
  #    db/config/pg_hba.conf            — правила аутентификации,
  #    db/security/                     — создание сервисных юзеров,
  #    db/scripts/apply_custom_conf.sh  — установка include в postgresql.conf.
  db:
    image: postgres:17-alpine
    container_name: postgres
    depends_on:
      pglogs_init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      COMMERCE_DB_PASSWORD: ${COMMERCE_DB_PASSWORD}
      SUPPORT_DB_PASSWORD: ${SUPPORT_DB_PASSWORD}
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pglogs:/var/log/postgresql
      # init-скрипты: создание сервисных юзеров + apply кастомного конфига.
      # Postgres entrypoint исполняет файлы из /docker-entrypoint-initdb.d/
      # по alfabetical order, поэтому префикс 00_/01_/02_ задаёт порядок:
      #   00_init_app_users.sh   — создаёт сервисные роли через psql -v.
      #   01_create_app_users.sql— SQL с DO-блоками (вызывается из 00_*).
      #   02_apply_custom_conf.sh— дописывает include = '...' в postgresql.conf.
      - ../db/security/00_init_app_users.sh:/docker-entrypoint-initdb.d/00_init_app_users.sh:ro
      - ../db/scripts/apply_custom_conf.sh:/docker-entrypoint-initdb.d/02_apply_custom_conf.sh:ro
      # SQL-скрипт намеренно НЕ кладём в /docker-entrypoint-initdb.d/,
      # потому что postgres-entrypoint запустил бы его повторно (без
      # psql-переменных :auth_pass и т.д. → синтаксическая ошибка).
      # Сам файл вызывается из 00_init_app_users.sh с нужными -v.
      - ../db/security/01_create_app_users.sql:/sql/01_create_app_users.sql:ro
      # Сами конфиги монтируем в отдельный каталог (apply-скрипт делает
      # include на эти пути и копирует pg_hba.conf в $PGDATA).
      - ../db/config/postgresql.custom.conf:/etc/postgresql/clover/postgresql.custom.conf:ro
      - ../db/config/pg_hba.conf:/etc/postgresql/clover/pg_hba.conf:ro

  db_migrate:
    image: migrate/migrate
    container_name: db_migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - up

  #  Выдача табличных грантов сервисным ролям.
  #  Init-скрипты postgres-образа выполняются ДО появления таблиц,
  #  поэтому GRANT'ы на конкретные таблицы вынесены сюда — отдельный
  #  one-shot контейнер запускается после успешного завершения
  #  миграций и применяет db/security/02_grant_table_privileges.sql.
  #  GRANT в postgres идемпотентен, повторный запуск ничего не ломает.
  db_grants:
    image: postgres:17-alpine
    container_name: db_grants
    depends_on:
      db_migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../db/security/02_grant_table_privileges.sql:/grants.sql:ro
    entrypoint: ["psql"]
    command:
      - -v
      - ON_ERROR_STOP=1
      - -h
      - db
      - -U
      - ${POSTGRES_USER}
      - -d
      - ${POSTGRES_DB}
      - -f
      - /grants.sql

  #  PGBADGER — оффлайн-анализатор логов PostgreSQL.
  #  Запускается по cron'у внутри контейнера, читает /var/log/postgresql
  #  и складывает HTML-отчёты в /var/www/pgbadger. Открыть через gateway:
  #    http://localhost:${GATEWAY_PORT}/pgbadger/
  #  (см. соответствующий location в deployments/nginx/nginx.conf).
  pgbadger:
    image: ghcr.io/dalibo/pgbadger:13.0
    container_name: pgbadger
    restart: unless-stopped
    user: "postgres"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mkdir -p /var/www/pgbadger &&
        while true; do
          pgbadger -I -q
            -O /var/www/pgbadger
            -f csv
            --prefix '%t [%p]: user=%u,db=%d,app=%a,client=%h '
            /var/log/postgresql/postgresql-*.csv || true;
          sleep 300;
        done
    volumes:
      - pglogs:/var/log/postgresql:ro
      - pgbadger_reports:/var/www/pgbadger
    depends_on:
      db:
        condition: service_healthy

  #  POSTGRES EXPORTER — экспорт метрик postgres в Prometheus.
  #  Подключается под сервисной учёткой clover_monitoring (роль pg_monitor).
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://clover_monitoring:${MONITORING_DB_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

  #  AUTH SERVICE (http 8001, grpc 9001 — services/auth/config/local.json)
  #  Подключается к БД под сервисной ролью auth_app с правами SELECT/INSERT/
  #  UPDATE только на таблицу "user" (см. db/security/01_create_app_users.sql).
  #  Клиентские таймауты заданы через options= в DSN (см. db/README.md).
  auth:
    container_name: auth
    build:
      context: ..
      dockerfile: ./deployments/Dockerfile.auth
    env_file:
      - ../.env
    environment:
      - DATABASE_DSN=postgres://auth_app:${AUTH_DB_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable&application_name=auth&options=-c%20statement_timeout%3D30000%20-c%20lock_timeout%3D5000%20-c%20idle_in_transaction_session_timeout%3D60000
      - REDIS_ADDR=${REDIS_ADDR}
      - KAFKA_BROKERS=kafka:29092
    restart: unless-stopped
    # Порты доступны только внутри docker-сети (gateway ходит по имени auth:8001,
    # catalog/support/commerce — по auth:9001 gRPC). Наружу host'а не публикуются.
    expose:
      - "8001"
      - "9001"
    depends_on:
      db_grants:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka:
        condition: service_healthy

  #  SUPPORT SERVICE (http 8002 — services/support/config/local.json)
  #  Сервисная роль: support_app.
  support:
    container_name: support
    build:
      context: ..
      dockerfile: ./deployments/Dockerfile.support
    env_file:
      - ../.env
    environment:
      - DATABASE_DSN=postgres://support_app:${SUPPORT_DB_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable&application_name=support&options=-c%20statement_timeout%3D30000%20-c%20lock_timeout%3D5000%20-c%20idle_in_transaction_session_timeout%3D60000
      - AUTH_GRPC_ADDR=auth:9001
      - KAFKA_BROKERS=kafka:29092
    restart: unless-stopped
    # Доступен только внутри docker-сети (gateway → support:8002). Наружу не публикуется.
    expose:
      - "8002"
    depends_on:
      db_grants:
        condition: service_completed_successfully
      auth:
        condition: service_started
      kafka:
        condition: service_healthy

  #  CATALOG SERVICE (http 8004, grpc 9004 — services/catalog/config/local.json)
  #  Сервисная роль: catalog_app.
  catalog:
    container_name: catalog
    build:
      context: ..
      dockerfile: ./deployments/Dockerfile.catalog
    env_file:
      - ../.env
    environment:
      - DATABASE_DSN=postgres://catalog_app:${CATALOG_DB_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable&application_name=catalog&options=-c%20statement_timeout%3D30000%20-c%20lock_timeout%3D5000%20-c%20idle_in_transaction_session_timeout%3D60000
      - REDIS_ADDR=${REDIS_ADDR}
      - AUTH_GRPC_ADDR=auth:9001
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_GROUP_ID=catalog-service
    restart: unless-stopped
    # Доступен только внутри docker-сети (gateway → catalog:8004, commerce → catalog:9004 gRPC).
    # Наружу host'а не публикуется.
    expose:
      - "8004"
      - "9004"
    depends_on:
      db_grants:
        condition: service_completed_successfully
      redis:
        condition: service_started
      auth:
        condition: service_started
      kafka:
        condition: service_healthy

  #  COMMERCE SERVICE (http 8006 — services/commerce/config/local.json)
  #  Сервисная роль: commerce_app.
  commerce:
    container_name: commerce
    build:
      context: ..
      dockerfile: ./deployments/Dockerfile.commerce
    env_file:
      - ../.env
    environment:
      - DATABASE_DSN=postgres://commerce_app:${COMMERCE_DB_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable&application_name=commerce&options=-c%20statement_timeout%3D30000%20-c%20lock_timeout%3D5000%20-c%20idle_in_transaction_session_timeout%3D60000
      - AUTH_GRPC_ADDR=auth:9001
      - CATALOG_GRPC_ADDR=catalog:9004
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_GROUP_ID=commerce-service
    restart: unless-stopped
    # Доступен только внутри docker-сети (gateway → commerce:8006). Наружу не публикуется.
    expose:
      - "8006"
    depends_on:
      db_grants:
        condition: service_completed_successfully
      auth:
        condition: service_started
      catalog:
        condition: service_started
      kafka:
        condition: service_healthy

  #  ОБЩАЯ ИНФРАСТРУКТУРА
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

  #  SWAGGER UI (читает api/swagger.yaml, доступен через gateway: /swagger/)
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    container_name: swagger_ui
    restart: unless-stopped
    environment:
      SWAGGER_JSON: /spec/swagger.yaml
      BASE_URL: /swagger
    volumes:
      - ../api/swagger.yaml:/spec/swagger.yaml:ro

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    restart: unless-stopped
    init: true
    mem_limit: 768m
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms256m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/29092' || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s

  #  OBSERVABILITY
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: clickhouse
    restart: unless-stopped
    mem_limit: 1500m
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "${CLICKHOUSE_PORT}:8123"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_MAX_SERVER_MEMORY_USAGE: "1073741824"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  vector:
    image: timberio/vector:0.43.1-alpine
    container_name: vector
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      clickhouse:
        condition: service_healthy

  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node_exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|etc)($$|/)"
      - "--collector.filesystem.fs-types-exclude=^(tmpfs|overlay|squashfs|devtmpfs|nsfs|autofs|binfmt_misc|cgroup2?|debugfs|fusectl|hugetlbfs|mqueue|pstore|tracefs|configfs|bpf|ramfs|rpc_pipefs|securityfs)$$"
    volumes:
      - "/proc:/host/proc:ro"
      - "/sys:/host/sys:ro"
      - "/:/host:ro"

  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    mem_limit: 384m

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      clickhouse:
        condition: service_healthy
      prometheus:
        condition: service_started

volumes:
  pgdata:
  pglogs:               # логи postgres в формате CSV для pgbadger
  pgbadger_reports:     # HTML-отчёты, отдаются через gateway
  redis_data:
  kafka_data:
  clickhouse_data:
  prometheus_data:
  grafana_data:
