# Порты сервисов задаются в конфигах:
#   Монолит: config/local.json              → port 8000
#   Auth:    services/auth/config/local.json → http 8001, grpc 9001
# При изменении портов в конфигах — обновить port mapping здесь.

services:

  # ════════════════════════════════════════════════
  #  API GATEWAY
  # ════════════════════════════════════════════════

  gateway:
    image: nginx:1.27-alpine
    container_name: gateway
    ports:
      - "${GATEWAY_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - monolith
      - auth
      - support
    restart: unless-stopped

  # ════════════════════════════════════════════════
  #  МОНОЛИТ (port 8000 — config/local.json)
  # ════════════════════════════════════════════════

  monolith:
    container_name: monolith
    build:
      context: ..
      dockerfile: ./deployments/Dockerfile
    env_file:
      - ../.env
    environment:
      - DATABASE_DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@monolith_db:5432/${MONOLITH_POSTGRES_DB}?sslmode=disable
      - REDIS_ADDR=${REDIS_ADDR}
    restart: unless-stopped
    ports:
      - "${MONOLITH_PORT}:8000"
    volumes:
      - ../static:/app/static
      - ../storage:/app/storage
    depends_on:
      monolith_db_migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  monolith_db:
    image: postgres:17-alpine
    container_name: postgres_monolith
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${MONOLITH_POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${MONOLITH_POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - monolith_pgdata:/var/lib/postgresql/data

  monolith_db_migrate:
    image: migrate/migrate
    container_name: monolith_db_migrate
    depends_on:
      monolith_db:
        condition: service_healthy
    volumes:
      - ../internal/repository/postgres/migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@monolith_db:5432/${MONOLITH_POSTGRES_DB}?sslmode=disable
      - up

  # ════════════════════════════════════════════════
  #  AUTH SERVICE (http 8001, grpc 9001 — services/auth/config/local.json)
  # ════════════════════════════════════════════════

  auth:
    container_name: auth
    build:
      context: ..
      dockerfile: ./deployments/Dockerfile.auth
    env_file:
      - ../.env
    environment:
      - DATABASE_DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@monolith_db:5432/${MONOLITH_POSTGRES_DB}?sslmode=disable
      - REDIS_ADDR=${REDIS_ADDR}
      - KAFKA_BROKERS=kafka:29092
    restart: unless-stopped
    ports:
      - "${AUTH_HTTP_PORT}:8001"
      - "${AUTH_GRPC_PORT}:9001"
    depends_on:
      monolith_db_migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka:
        condition: service_healthy

  # ════════════════════════════════════════════════
  #  SUPPORT SERVICE (http 8002 — services/support/config/local.json)
  # ════════════════════════════════════════════════

  support:
    container_name: support
    build:
      context: ..
      dockerfile: ./deployments/Dockerfile.support
    env_file:
      - ../.env
    environment:
      - DATABASE_DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@monolith_db:5432/${MONOLITH_POSTGRES_DB}?sslmode=disable
      - AUTH_GRPC_ADDR=auth:9001
      - KAFKA_BROKERS=kafka:29092
    restart: unless-stopped
    ports:
      - "${SUPPORT_HTTP_PORT}:8002"
    depends_on:
      monolith_db_migrate:
        condition: service_completed_successfully
      auth:
        condition: service_started
      kafka:
        condition: service_healthy

  # ════════════════════════════════════════════════
  #  ОБЩАЯ ИНФРАСТРУКТУРА
  # ════════════════════════════════════════════════

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  monolith_pgdata:
  redis_data:
  kafka_data:
