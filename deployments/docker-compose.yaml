services:
  clover:
    container_name: clover
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file:
      - .env
    restart: always
    ports:
      - 8000:8000
    volumes:
      # путь_на_хосте : путь_в_контейнере
      - ./static:/app/static
      - ./storage:/app/storage
    depends_on:
      - redis
      - db
      
  db:
    image: postgres:17-alpine
    container_name: postgres_clover
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis_data:/data

volumes:
  redis_data:
  pgdata:
