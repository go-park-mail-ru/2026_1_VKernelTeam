# Порты сервисов задаются в конфигах:
#   Монолит: config/local.json              → port 8000
#   Auth:    services/auth/config/local.json → http 8001, grpc 9001
# При изменении портов в конфигах — обновить port mapping здесь.

services:

  # ════════════════════════════════════════════════
  #  API GATEWAY
  # ════════════════════════════════════════════════

  gateway:
    image: nginx:1.27-alpine
    container_name: gateway
    ports:
      - "${GATEWAY_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - monolith
      - auth
      - support
      - catalog
      - commerce
    restart: unless-stopped

  # ════════════════════════════════════════════════
  #  МОНОЛИТ (port 8000 — config/local.json)
  # ════════════════════════════════════════════════

  monolith:
    container_name: monolith
    build:
      context: ..
      dockerfile: ./deployments/Dockerfile
    env_file:
      - ../.env
    environment:
      - DATABASE_DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_ADDR=${REDIS_ADDR}
    restart: unless-stopped
    ports:
      - "${MONOLITH_PORT}:8000"
    volumes:
      - ../static:/app/static
      - ../storage:/app/storage
    depends_on:
      db_migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  # ════════════════════════════════════════════════
  #  ОБЩАЯ БД (одна на все сервисы — Database Shared)
  # ════════════════════════════════════════════════

  db:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  db_migrate:
    image: migrate/migrate
    container_name: db_migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - up

  # ════════════════════════════════════════════════
  #  AUTH SERVICE (http 8001, grpc 9001 — services/auth/config/local.json)
  # ════════════════════════════════════════════════

  auth:
    container_name: auth
    build:
      context: ..
      dockerfile: ./deployments/Dockerfile.auth
    env_file:
      - ../.env
    environment:
      - DATABASE_DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_ADDR=${REDIS_ADDR}
      - KAFKA_BROKERS=kafka:29092
    restart: unless-stopped
    ports:
      - "${AUTH_HTTP_PORT}:8001"
      - "${AUTH_GRPC_PORT}:9001"
    depends_on:
      db_migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka:
        condition: service_healthy

  # ════════════════════════════════════════════════
  #  SUPPORT SERVICE (http 8002 — services/support/config/local.json)
  # ════════════════════════════════════════════════

  support:
    container_name: support
    build:
      context: ..
      dockerfile: ./deployments/Dockerfile.support
    env_file:
      - ../.env
    environment:
      - DATABASE_DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - AUTH_GRPC_ADDR=auth:9001
      - KAFKA_BROKERS=kafka:29092
    restart: unless-stopped
    ports:
      - "${SUPPORT_HTTP_PORT}:8002"
    depends_on:
      db_migrate:
        condition: service_completed_successfully
      auth:
        condition: service_started
      kafka:
        condition: service_healthy

  # ════════════════════════════════════════════════
  #  CATALOG SERVICE (http 8004, grpc 9004 — services/catalog/config/local.json)
  # ════════════════════════════════════════════════

  catalog:
    container_name: catalog
    build:
      context: ..
      dockerfile: ./deployments/Dockerfile.catalog
    env_file:
      - ../.env
    environment:
      - DATABASE_DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_ADDR=${REDIS_ADDR}
      - AUTH_GRPC_ADDR=auth:9001
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_GROUP_ID=catalog-service
    restart: unless-stopped
    ports:
      - "${CATALOG_HTTP_PORT}:8004"
      - "${CATALOG_GRPC_PORT}:9004"
    depends_on:
      db_migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      auth:
        condition: service_started
      kafka:
        condition: service_healthy

  # ════════════════════════════════════════════════
  #  COMMERCE SERVICE (http 8006 — services/commerce/config/local.json)
  # ════════════════════════════════════════════════

  commerce:
    container_name: commerce
    build:
      context: ..
      dockerfile: ./deployments/Dockerfile.commerce
    env_file:
      - ../.env
    environment:
      - DATABASE_DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - AUTH_GRPC_ADDR=auth:9001
      - CATALOG_GRPC_ADDR=catalog:9004
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_GROUP_ID=commerce-service
    restart: unless-stopped
    ports:
      - "${COMMERCE_HTTP_PORT}:8006"
    depends_on:
      db_migrate:
        condition: service_completed_successfully
      auth:
        condition: service_started
      catalog:
        condition: service_started
      kafka:
        condition: service_healthy

  # ════════════════════════════════════════════════
  #  ОБЩАЯ ИНФРАСТРУКТУРА
  # ════════════════════════════════════════════════

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ════════════════════════════════════════════════
  #  OBSERVABILITY
  # ════════════════════════════════════════════════

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - "${CLICKHOUSE_PORT}:8123"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  vector:
    image: timberio/vector:0.43.1-alpine
    container_name: vector
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      clickhouse:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      clickhouse:
        condition: service_healthy
      prometheus:
        condition: service_started

volumes:
  pgdata:
  redis_data:
  kafka_data:
  clickhouse_data:
  prometheus_data:
  grafana_data:
