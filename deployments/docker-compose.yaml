# Порты сервисов задаются в конфигах services/<name>/config/local.json:
#   auth     → http 8001, grpc 9001
#   support  → http 8002
#   catalog  → http 8004, grpc 9004
#   commerce → http 8006
# При изменении портов в конфигах — обновить port mapping здесь.

services:

  #  API GATEWAY + раздача фронтенда (HTTPS, HTTP/2)
  gateway:
    image: nginx:1.27-alpine
    container_name: gateway
    ports:
      - "${GATEWAY_PORT}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # SPA-сборка фронтенда (webpack складывает в dist/, рядом лежат .gz/.br).
      - ${FRONTEND_DIST_PATH:-../../2026_1_VKernel_Team/dist}:/usr/share/nginx/html:ro
      # Сертификаты Let's Encrypt с хоста (выпускаются certbot'ом, ниже).
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot для ACME-challenge.
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - auth
      - support
      - catalog
      - commerce
      - swagger-ui
      - grafana
      - prometheus
    restart: unless-stopped

  #  CERTBOT — выпускает и автообновляет сертификат Let's Encrypt раз в 12 ч.
  #  Первый выпуск (когда сертификата ещё нет):
  #    docker compose run --rm --entrypoint "certbot certonly --webroot \
  #      -w /var/www/certbot -d clover-go.ru \
  #      --email you@example.com --agree-tos --no-eff-email" certbot
  #  После получения сертификата перезагрузить nginx: docker compose exec gateway nginx -s reload
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    restart: unless-stopped
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

  #  ОБЩАЯ БД
  db:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  db_migrate:
    image: migrate/migrate
    container_name: db_migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - up

  #  AUTH SERVICE (http 8001, grpc 9001 — services/auth/config/local.json)
  auth:
    container_name: auth
    build:
      context: ..
      dockerfile: ./deployments/Dockerfile.auth
    env_file:
      - ../.env
    environment:
      - DATABASE_DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_ADDR=${REDIS_ADDR}
      - KAFKA_BROKERS=kafka:29092
    restart: unless-stopped
    # Порты доступны только внутри docker-сети (gateway ходит по имени auth:8001,
    # catalog/support/commerce — по auth:9001 gRPC). Наружу host'а не публикуются.
    expose:
      - "8001"
      - "9001"
    depends_on:
      db_migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka:
        condition: service_healthy

  #  SUPPORT SERVICE (http 8002 — services/support/config/local.json)
  support:
    container_name: support
    build:
      context: ..
      dockerfile: ./deployments/Dockerfile.support
    env_file:
      - ../.env
    environment:
      - DATABASE_DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - AUTH_GRPC_ADDR=auth:9001
      - KAFKA_BROKERS=kafka:29092
    restart: unless-stopped
    # Доступен только внутри docker-сети (gateway → support:8002). Наружу не публикуется.
    expose:
      - "8002"
    depends_on:
      db_migrate:
        condition: service_completed_successfully
      auth:
        condition: service_started
      kafka:
        condition: service_healthy

  #  CATALOG SERVICE (http 8004, grpc 9004 — services/catalog/config/local.json)
  catalog:
    container_name: catalog
    build:
      context: ..
      dockerfile: ./deployments/Dockerfile.catalog
    env_file:
      - ../.env
    environment:
      - DATABASE_DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_ADDR=${REDIS_ADDR}
      - AUTH_GRPC_ADDR=auth:9001
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_GROUP_ID=catalog-service
    restart: unless-stopped
    # Доступен только внутри docker-сети (gateway → catalog:8004, commerce → catalog:9004 gRPC).
    # Наружу host'а не публикуется.
    expose:
      - "8004"
      - "9004"
    depends_on:
      db_migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      auth:
        condition: service_started
      kafka:
        condition: service_healthy

  #  COMMERCE SERVICE (http 8006 — services/commerce/config/local.json)
  commerce:
    container_name: commerce
    build:
      context: ..
      dockerfile: ./deployments/Dockerfile.commerce
    env_file:
      - ../.env
    environment:
      - DATABASE_DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_ADDR=${REDIS_ADDR}
      - AUTH_GRPC_ADDR=auth:9001
      - CATALOG_GRPC_ADDR=catalog:9004
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_GROUP_ID=commerce-service
    restart: unless-stopped
    # Доступен только внутри docker-сети (gateway → commerce:8006). Наружу не публикуется.
    expose:
      - "8006"
    depends_on:
      db_migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      auth:
        condition: service_started
      catalog:
        condition: service_started
      kafka:
        condition: service_healthy

  #  ОБЩАЯ ИНФРАСТРУКТУРА
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

  #  SWAGGER UI (читает api/swagger.yaml, доступен через gateway: /swagger/)
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    container_name: swagger_ui
    restart: unless-stopped
    environment:
      SWAGGER_JSON: /spec/swagger.yaml
      BASE_URL: /swagger
    volumes:
      - ../api/swagger.yaml:/spec/swagger.yaml:ro

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    restart: unless-stopped
    init: true
    mem_limit: 768m
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms256m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/29092' || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s

  #  OBSERVABILITY
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: clickhouse
    restart: unless-stopped
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "${CLICKHOUSE_PORT}:8123"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8123/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  vector:
    image: timberio/vector:0.43.1-alpine
    container_name: vector
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      clickhouse:
        condition: service_healthy

  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node_exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|etc)($$|/)"
      - "--collector.filesystem.fs-types-exclude=^(tmpfs|overlay|squashfs|devtmpfs|nsfs|autofs|binfmt_misc|cgroup2?|debugfs|fusectl|hugetlbfs|mqueue|pstore|tracefs|configfs|bpf|ramfs|rpc_pipefs|securityfs)$$"
    volumes:
      - "/proc:/host/proc:ro"
      - "/sys:/host/sys:ro"
      - "/:/host:ro"

  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: prometheus
    restart: unless-stopped
    # Порт наружу не публикуем — фаервол VK Cloud открывает только 80/443,
    # доступ только через nginx по https://clover-go.ru/prometheus/.
    expose:
      - "9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
      # external-url нужен, чтобы UI Prometheus формировал корректные
      # абсолютные ссылки за reverse-proxy. route-prefix=/ — мы НЕ срезаем
      # /prometheus в nginx (proxy_pass без слэша), внутри контейнера URL
      # остаются на корне.
      - "--web.external-url=https://clover-go.ru/prometheus/"
      - "--web.route-prefix=/"
    mem_limit: 384m

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    restart: unless-stopped
    # Порт наружу не публикуем — доступ только через nginx по https://clover-go.ru/grafana/.
    # Так Grafana переиспользует TLS gateway и не конфликтует с HSTS на других портах.
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_DISABLE_PLUGINS: "grafana-lokiexplore-app,grafana-metricsdrilldown-app,grafana-pyroscope-app,grafana-exploretraces-app"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      # Раздача из подпути за reverse-proxy.
      GF_SERVER_ROOT_URL: https://clover-go.ru/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Grafana 11 за reverse-proxy: без явного списка доверенных Origin
      # CSRF middleware отдаёт 403 на /api/ds/query и /api/live/ws.
      # ROOT_URL уже добавляет clover-go.ru в trusted, но cookie-настройки
      # ниже нужны для HTTPS-куки и Live-стримов.
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: "lax"
      GF_SECURITY_CSRF_TRUSTED_ORIGINS: "clover-go.ru"
      GF_SECURITY_CSRF_ADDITIONAL_HEADERS: "X-Forwarded-Host"
      GF_LIVE_ALLOWED_ORIGINS: "https://clover-go.ru"
      # Анонимный Viewer — чтобы команда могла открывать дашборды без логина.
      # Право на просмотр + datasource query, без edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      clickhouse:
        condition: service_healthy
      prometheus:
        condition: service_started

volumes:
  pgdata:
  redis_data:
  kafka_data:
  clickhouse_data:
  prometheus_data:
  grafana_data:
  certbot_webroot:
