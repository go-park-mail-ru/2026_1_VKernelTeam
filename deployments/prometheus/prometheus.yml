global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Сервисы Clover
  - job_name: "auth"
    static_configs:
      - targets: ["auth:8001"]
    metrics_path: /metrics

  - job_name: "support"
    static_configs:
      - targets: ["support:8002"]
    metrics_path: /metrics

  - job_name: "catalog"
    static_configs:
      - targets: ["catalog:8004"]
    metrics_path: /metrics

  - job_name: "commerce"
    static_configs:
      - targets: ["commerce:8006"]
    metrics_path: /metrics

  # Системные метрики хоста
  - job_name: "node"
    static_configs:
      - targets: ["node_exporter:9100"]

  # Vector metrics (через prometheus_exporter sink на :9598)
  - job_name: "vector"
    static_configs:
      - targets: ["vector:9598"]
    metrics_path: /metrics

  # PostgreSQL метрики (postgres_exporter под ролью clover_monitoring).
  # Эта job отвечает за пункт «Мониторинг нагрузки на сервер БД»:
  # количество соединений, скорости commit/rollback, hit-ratio buffers,
  # locks, replication-лаг, размер WAL и т.д.
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres_exporter:9187"]
    metrics_path: /metrics
