# =============================================================================
#  Кастомная конфигурация PostgreSQL для маркетплейса «Клевер».
# -----------------------------------------------------------------------------
#  Назначение:
#    Файл подключается include-директивой из основного postgresql.conf:
#        include = '/etc/postgresql/clover/postgresql.custom.conf'
#    (см. db/scripts/apply_custom_conf.sh и docker-compose монтирование).
#    Параметры здесь имеют приоритет над дефолтами postgres:17-alpine.
#
#  Обоснование выбранных значений — в db/README.md
#  (разделы «Connection pool», «Таймауты», «Логгирование»).
# =============================================================================

# -----------------------------------------------------------------------------
# 1. CONNECTIONS / NETWORKING
# -----------------------------------------------------------------------------

# listen_addresses: на каких IP сервер слушает входящие соединения.
#   В нашей архитектуре postgres находится в docker-сети рядом с
#   микросервисами (см. deployments/docker-compose.yaml). Снаружи он
#   доступен только через port-mapping на хост-разработчика, и наружу
#   мира никогда не публикуется (в проде между постгресом и Интернетом
#   будет внутренний VPC).
#
#   * '*'       — слушать все интерфейсы. Удобно для разработки, но
#                 в проде даёт лишнюю поверхность атаки.
#   * 'localhost' — только loopback. В docker это значит «только
#                 внутри самого контейнера», микросервисы не достучатся.
#   * '0.0.0.0' — все IPv4. Подходит для docker-network, потому что
#                 фильтрация всё равно делается на уровне сети docker
#                 и pg_hba.conf.
#
# Выбор: '0.0.0.0' — внутри контейнера слушать все интерфейсы (docker
# сеть всё равно изолирована), а доступ контролируется pg_hba.conf
# (см. db/config/pg_hba.conf) и firewall'ом хоста. Подключения с
# реальных «внешних» IP в pg_hba.conf запрещены.
listen_addresses = '0.0.0.0'

# Порт стандартный.
port = 5432

# max_connections: максимум физических соединений к серверу.
#   Каждое соединение в postgres — это отдельный процесс с work_mem
#   на каждый узел плана. Считаем с запасом по сервисам:
#     auth_app      25
#     catalog_app   35
#     commerce_app  35
#     support_app   15
#     monitoring     5
#     reserved (миграции, ручные подключения, репликация в будущем)  35
#   Итого = 150.
#
#   Связь с connection pool приложения:
#     pgxpool в каждом сервисе настроен на MaxConns=10, MinConns=2
#     (после ДЗ — см. services/*/internal/repository/postgres/client.go).
#     Сервис auth в k8s-стиле обычно запускается в 2-3 репликах -> до
#     30 соединений; catalog/commerce — 3-4 реплики -> до 40 соединений
#     каждый. Сумма с запасом укладывается в 150 и не упирается в лимит,
#     даже если все сервисы одновременно поднимут все соединения
#     до максимума.
#
#   Почему не 500: с ростом max_connections растёт расход RAM
#   (~10 МБ на бэкенд) и накладные расходы на planner cache; в нашем
#   сценарии (8 ГБ RAM на инстанс БД) держать 500 коннектов нерационально.
max_connections = 150

# Резерв соединений суперпользователю для аварийных входов.
superuser_reserved_connections = 5

# -----------------------------------------------------------------------------
# 2. AUTHENTICATION / SECURITY
# -----------------------------------------------------------------------------

# scram-sha-256 — современный и безопасный механизм хеширования паролей.
# md5 устарел и легко брутфорсится. Все новые пароли хешируются по SCRAM.
password_encryption = scram-sha-256

# Запрет анонимных подключений: trust никогда не используется
# (см. db/config/pg_hba.conf).

# SSL включаем только в проде (в локальном docker сертификаты не нужны).
# В проде здесь будет ssl = on + ssl_cert_file / ssl_key_file.
ssl = off

# -----------------------------------------------------------------------------
# 3. CLIENT-LEVEL TIMEOUTS
# -----------------------------------------------------------------------------
#  Все клиентские таймауты заданы на уровне сервера как пределы по
#  умолчанию. Приложение дополнительно задаёт их в DSN через параметры
#  pgx (см. services/*/internal/repository/postgres/client.go).
#
#  Обоснование (детальнее — в db/README.md):
#    * statement_timeout = 30s.
#      OLTP-нагрузка маркетплейса: листинги, поиск, корзина. Реальные
#      запросы укладываются в 200-300 мс. 30 секунд — это «запрос явно
#      повис»: либо deadlock, либо забытый ORDER BY на огромной выборке,
#      либо «висящий» вебсокет. Минута и более — UX-катастрофа: пока
#      висит запрос, висит и worker сервиса, и место в pool. DoS-устойчивость
#      также важнее: атакующий через POST /search?q=<тяжёлая выборка>
#      легко исчерпает пул. 30s — компромисс между «не убить случайные
#      долгие отчёты» и «не отдать сервис под DoS».
#    * lock_timeout = 5s.
#      Блокировки в OLTP не должны висеть. 5 секунд — это уже «что-то
#      идёт не так»: попали в lock contention или взяли row lock без
#      намерения отпустить.
#    * idle_in_transaction_session_timeout = 60s.
#      Защита от «забыл commit/rollback»: транзакция, в которой ничего
#      не происходит, удерживает строки и мешает autovacuum.
#    * idle_session_timeout = 0 (без ограничения).
#      pgxpool сам управляет временем жизни idle-соединений; жёсткий
#      серверный таймаут навредит — пул будет переподключаться.
statement_timeout                   = '30s'
lock_timeout                        = '5s'
idle_in_transaction_session_timeout = '60s'
idle_session_timeout                = 0

# tcp_keepalives — поддержка TCP-соединений живыми. Помогает быстро
# заметить «оторванные» сессии (например, упавший под).
tcp_keepalives_idle     = 60
tcp_keepalives_interval = 10
tcp_keepalives_count    = 3

# -----------------------------------------------------------------------------
# 4. SHARED LIBRARIES (preload)
# -----------------------------------------------------------------------------
# pg_stat_statements и auto_explain — это расширения, реализованные как
# C-модули. Их обязательно подключать через shared_preload_libraries
# при старте сервера (иначе CREATE EXTENSION не загрузит код).
shared_preload_libraries = 'pg_stat_statements,auto_explain'

# -----------------------------------------------------------------------------
# 5. pg_stat_statements
# -----------------------------------------------------------------------------
# Расширение собирает агрегированную статистику по нормализованным
# текстам запросов: суммарное время, число вызовов, прочитанные блоки,
# I/O wait. Это основной источник данных для оптимизации.
#
# pg_stat_statements.max — сколько уникальных запросов хранить
# одновременно. 10000 хватит на средний микросервис, который обычно
# имеет десятки шаблонов запросов на сервис.
pg_stat_statements.max  = 10000

# Какие запросы трекать: all (включая запросы внутри функций) — даёт
# полную картину, top — только внешние. На небольшом проекте берём all.
pg_stat_statements.track = all

# Считать ли утилитарные запросы (CREATE, ALTER, VACUUM). Удобно для
# отслеживания миграций и фоновой работы.
pg_stat_statements.track_utility = on

# Сохранять статистику между рестартами postgres.
pg_stat_statements.save = on

# -----------------------------------------------------------------------------
# 6. auto_explain
# -----------------------------------------------------------------------------
# Автоматически логирует EXPLAIN-план для запросов, которые выполнялись
# дольше порога. Идеальный инструмент, чтобы понять, ПОЧЕМУ запрос
# попал в лог медленных, не воспроизводя его руками.
auto_explain.log_min_duration = '500ms'   # тот же порог, что и log_min_duration_statement
auto_explain.log_analyze      = on        # настоящее время выполнения (а не estimated cost)
auto_explain.log_buffers      = on        # учёт I/O (shared/local/temp blocks)
auto_explain.log_wal          = on        # WAL-нагрузка от запроса (PG13+)
auto_explain.log_timing       = on        # тайминги по узлам плана
auto_explain.log_triggers     = on        # время отрабатывания триггеров
auto_explain.log_verbose      = off       # verbose даёт колоссальные планы — выкл.
auto_explain.log_nested_statements = on   # запросы внутри pl/pgsql-функций
auto_explain.log_format       = text      # text лучше парсится глазами и pgbadger

# auto_explain включается не для всех сессий, а только с вероятностью
# log_min_duration. 1.0 = логируем 100% медленных запросов. На проде
# при большой нагрузке можно понизить (например 0.1), чтобы не
# нагружать I/O логов; на стенде разработки оставляем 100%.
auto_explain.sample_rate = 1.0

# -----------------------------------------------------------------------------
# 7. LOGGING (формат под pgbadger)
# -----------------------------------------------------------------------------
# pgbadger требует строго определённый формат log_line_prefix.
# Любое отклонение — и парсер просто не увидит запрос.
# Рекомендованный формат из документации pgbadger:
#     %t [%p]: user=%u,db=%d,app=%a,client=%h
# где
#     %t — timestamp
#     %p — pid процесса
#     %u/%d — пользователь/база
#     %a — application_name (catalog/auth/...)
#     %h — клиентский хост

log_destination          = 'stderr,csvlog'
logging_collector        = on
log_directory            = '/var/log/postgresql'
log_filename             = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age         = '1d'
log_rotation_size        = '100MB'
log_file_mode            = 0640
log_truncate_on_rotation = on

log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '

# Лог всех запросов длиннее порога. 500 мс — достаточно для OLTP:
# нормальный запрос (по индексу) укладывается в десятки мс. Всё, что
# больше — кандидат на оптимизацию.
log_min_duration_statement = '500ms'

# Ошибки и warning'и — обязательно.
log_min_messages         = warning
log_min_error_statement  = error

# Дополнительные события, которые любит читать pgbadger:
log_checkpoints      = on   # длительные чекпоинты — признак неверного wal/shared_buffers
log_connections      = on   # видим, кто и когда подключился (audit)
log_disconnections   = on   # парные строки к connections
log_lock_waits       = on   # все случаи, когда запрос ждал блокировку >deadlock_timeout
log_temp_files       = 0    # любой temp file (kB). 0 = логировать все
log_autovacuum_min_duration = '1s' # фоновый автовакуум, если затянулся

# Запросы log'ируем без statement-логгирования по умолчанию — оно даёт
# слишком много шума. log_min_duration_statement и auto_explain
# покрывают то, что реально нужно.
log_statement = 'none'

# Формат CSV-логов для pgbadger удобнее парсить, чем сырой stderr —
# pgbadger поддерживает оба, мы держим оба.

# Часовой пояс логов — UTC, чтобы pgbadger и графана единообразно
# показывали время вне зависимости от tz контейнера.
log_timezone = 'UTC'

# -----------------------------------------------------------------------------
# 8. RESOURCE USAGE (минимально достаточный тюнинг)
# -----------------------------------------------------------------------------
# Эти значения рассчитаны на инстанс 4 vCPU / 8 GB RAM. Они не часть
# темы ДЗ, но без них логи будут забиваться предупреждениями.
shared_buffers      = '1GB'    # ~25% RAM хоста
effective_cache_size = '4GB'   # подсказка планировщику (~50% RAM)
work_mem            = '16MB'   # на одну операцию сортировки/hash
maintenance_work_mem = '256MB' # VACUUM, CREATE INDEX, ALTER TABLE
wal_buffers         = '16MB'

# -----------------------------------------------------------------------------
# 9. AUTOVACUUM (важно для UX: «зависшие» запросы часто = пропустили VACUUM)
# -----------------------------------------------------------------------------
autovacuum                  = on
autovacuum_naptime          = '30s'
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# =============================================================================
# Конец конфигурации.
# =============================================================================
