# =============================================================================
#  PostgreSQL Client Authentication Configuration File
#  -----------------------------------------------------------------------------
#  Файл, который PostgreSQL читает при каждой попытке подключения и
#  принимает решение «можно ли пускать клиента, и каким методом
#  аутентификации проверять».
#
#  Структура строки:
#     TYPE  DATABASE  USER  ADDRESS  METHOD
#
#  Принципы, по которым составлен этот файл:
#    1. Default deny: всё, что не описано явно, отклоняется.
#    2. Локальные unix-сокеты — peer (нужны для healthcheck и init-скриптов
#       контейнера postgres, которые ходят под OS-пользователем postgres).
#    3. Сервисные роли подключаются с адресов docker-сети (172.16.0.0/12,
#       стандартный диапазон Docker bridge). scram-sha-256 — стойкий
#       хеш для паролей.
#    4. Мониторинг — отдельная роль, отдельная запись.
#    5. Никаких 'host all all 0.0.0.0/0' и md5 для всех — это типовая
#       уязвимость, мы её избегаем.
# =============================================================================

# TYPE  DATABASE        USER              ADDRESS          METHOD

# -----------------------------------------------------------------------------
# 1. Локальный администратор внутри контейнера postgres.
#    Нужен для healthcheck (pg_isready -U postgres) и для init-скриптов
#    в /docker-entrypoint-initdb.d/.
# -----------------------------------------------------------------------------
local   all             postgres                          peer

# -----------------------------------------------------------------------------
# 2. Replication: пока не используем (single-node), но в proto-проде
#    появится — оставляю шаблон с trust только через unix-socket.
# -----------------------------------------------------------------------------
local   replication     postgres                          peer

# -----------------------------------------------------------------------------
# 3. Сервисные роли приложения.
#    Подключаются по TCP из docker-сети. Используем strong-аутентификацию
#    SCRAM-SHA-256 (пароли захешированы в системной таблице pg_authid).
#
#    Здесь же ограничение по БД: каждой роли разрешено подключаться
#    ТОЛЬКО к базе `clover`. Если в будущем появится staging-БД на том
#    же инстансе, сервисная роль не сможет в неё зайти.
#
#    Диапазон 172.16.0.0/12 покрывает дефолтные docker bridge сети
#    (172.17.0.0/16, 172.18.0.0/16, ...). Для конкретной compose-сети
#    docker выделяет подсеть из этого диапазона, так что правило
#    работает без изменений при пересоздании сети.
# -----------------------------------------------------------------------------
host    clover          auth_app          172.16.0.0/12    scram-sha-256
host    clover          catalog_app       172.16.0.0/12    scram-sha-256
host    clover          commerce_app      172.16.0.0/12    scram-sha-256
host    clover          support_app       172.16.0.0/12    scram-sha-256

# -----------------------------------------------------------------------------
# 4. Мониторинг (postgres_exporter, pgbadger, DBA).
# -----------------------------------------------------------------------------
host    clover          clover_monitoring 172.16.0.0/12    scram-sha-256

# -----------------------------------------------------------------------------
# 5. Суперпользователь postgres — миграции и DBA.
#    Пускаем из docker-сети, потому что контейнер `db_migrate` находится
#    там же. С хоста-разработчика тоже пускаем (через 127.0.0.1, когда
#    проброшен порт). Сервисные роли через это правило НЕ ходят —
#    у них собственные строки выше.
# -----------------------------------------------------------------------------
host    clover          postgres          172.16.0.0/12    scram-sha-256
host    clover          postgres          127.0.0.1/32     scram-sha-256
host    clover          postgres          ::1/128          scram-sha-256

# -----------------------------------------------------------------------------
# 6. Default deny.
#    Эти строки можно опустить (PostgreSQL отказывает по умолчанию),
#    но оставляем явно — так в логах будет понятная строка про reject
#    при попытке подключиться чем-то непредусмотренным.
# -----------------------------------------------------------------------------
host    all             all               0.0.0.0/0        reject
host    all             all               ::/0             reject
