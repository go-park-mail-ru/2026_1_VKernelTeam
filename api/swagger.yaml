basePath: /api/v1
definitions:
  dto.AddToCartRequest:
    properties:
      product_id:
        type: integer
    type: object
  dto.CartItemResponse:
    properties:
      image_path:
        type: string
      price:
        type: integer
      product_id:
        type: integer
      seller_id:
        type: integer
      seller_name:
        type: string
      title:
        type: string
    type: object
  dto.CartResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.CartItemResponse'
        type: array
      total_price:
        type: integer
    type: object
  dto.CheckoutResponse:
    properties:
      order_ids:
        items:
          type: integer
        type: array
      sellers:
        additionalProperties:
          $ref: '#/definitions/dto.SellerContact'
        description: Ключ — ID продавца
        type: object
    type: object
  dto.CreateAdRequest:
    properties:
      category_id:
        type: integer
      description:
        type: string
      location:
        type: string
      photos:
        items:
          type: string
        type: array
      price:
        type: integer
      status:
        type: string
      title:
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.LoginResponse:
    properties:
      email:
        type: string
      name:
        type: string
      user_id:
        type: integer
    type: object
  dto.PublicUserResponse:
    properties:
      ads_count:
        type: integer
      avatar_path:
        type: string
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      rating:
        type: number
      reviews_count:
        type: integer
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  dto.SellerContact:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  dto.UpdateAdRequest:
    properties:
      category_id:
        type: integer
      description:
        type: string
      location:
        type: string
      price:
        type: integer
      status:
        type: string
      title:
        type: string
    type: object
  dto.UpdateProfileRequest:
    properties:
      name:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - name
    type: object
  dto.ValidationErrors:
    properties:
      category_id:
        type: string
      description:
        type: string
      email:
        type: string
      location:
        type: string
      name:
        type: string
      password:
        type: string
      photos:
        items:
          type: string
        type: array
      price:
        type: string
      status:
        type: string
      title:
        type: string
      user_id:
        type: string
    type: object
  models.Ad:
    properties:
      category_id:
        type: integer
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      favorites_count:
        type: integer
      id:
        type: integer
      location:
        type: string
      photos:
        items:
          type: string
        type: array
      price:
        type: integer
      seller_id:
        type: integer
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
      views_count:
        type: integer
    type: object
  models.User:
    properties:
      ads_count:
        type: integer
      avatar_path:
        type: string
      cart_count:
        type: integer
      created_at:
        type: string
      email:
        type: string
      favorites_count:
        type: integer
      id:
        type: integer
      name:
        type: string
      rating:
        type: number
      reviews_count:
        type: integer
      unread_messages_count:
        type: integer
      updated_at:
        type: string
    type: object
host: clover-go.ru
info:
  contact: {}
  description: API for the Clover service.
  title: Clover API
  version: "1.0"
paths:
  /ads:
    get:
      description: Возвращает список всех объявлений
      produces:
      - application/json
      responses:
        "200":
          description: список объявлений успешно получен
          schema:
            items:
              $ref: '#/definitions/models.Ad'
            type: array
        "400":
          description: 'Method not allowed: Метод не поддерживается (ожидается GET)'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера при получении объявлений'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получить список объявлений
      tags:
      - ads
    post:
      consumes:
      - application/json
      description: Создает новое объявление. Доступно только авторизованным пользователям.
      parameters:
      - description: Данные объявления (title, description, price, category_id, status,
          location)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAdRequest'
      produces:
      - application/json
      responses:
        "200":
          description: ID созданного объявления
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
        "400":
          description: invalid request body / ошибки валидации
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Создать объявление
      tags:
      - ads
  /ads/{id}:
    delete:
      description: Мягкое удаление объявления. Доступно только владельцу.
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: объявление успешно удалено
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'ad not found: Объявление не найдено или не принадлежит пользователю'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Удалить объявление
      tags:
      - ads
    get:
      description: Возвращает объявление по заданному ID
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: объявление успешно получено
          schema:
            $ref: '#/definitions/models.Ad'
        "400":
          description: 'ad not found: Объявление не найдено'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера при получении объявления'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получить объявление по ID
      tags:
      - ads
    put:
      consumes:
      - application/json
      description: Обновляет объявление по заданному ID. Доступно только владельцу
        объявления.
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: integer
      - description: Данные для обновления (title, description, price, category_id,
          status, location)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateAdRequest'
      produces:
      - application/json
      responses:
        "200":
          description: объявление успешно обновлено
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'ad not found: Объявление не найдено или не принадлежит пользователю'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Обновить объявление
      tags:
      - ads
  /ads/{id}/close:
    post:
      description: Устанавливает статус объявления в 'archived'. Доступно только владельцу.
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "0":
          description: 'ad not found: Объявление не найдено, уже архивировано или
            не принадлежит пользователю'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "200":
          description: объявление успешно архивировано
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'invalid ad id: Некорректный ID'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Закрыть объявление
      tags:
      - ads
  /auth/login:
    post:
      consumes:
      - application/json
      description: Аутентифицирует пользователя по email/пароль или, при наличии cookie,
        проверяет токен
      parameters:
      - description: Login credentials
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: login successful
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: 'invalid request body: Неверный формат тела запроса'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'invalid credentials / invalid or expired token / email/password
            is required (ValidationErrors): Ошибка аутентификации или невалидный токен'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'failed to login: Ошибка сервера при входе'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Вход пользователя
      tags:
      - auth
  /auth/logout:
    post:
      description: Инвалидирует текущую сессию и очищает аутентификационную куку
      responses:
        "200":
          description: logout successful
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'Missing CSRF cookie / CSRF token mismatch: Ошибка CSRF'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'missing token cookie / invalid token / token has been revoked:
            Ошибка авторизации (Middleware) или internal error: Отсутствует jti'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'failed to logout: Ошибка сервера при выходе'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Выход пользователя
      tags:
      - auth
  /auth/refresh:
    post:
      description: Получает новый access и rottates refresh token
      produces:
      - application/json
      responses:
        "200":
          description: tokens refreshed
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'refresh token required / invalid refresh token: Ошибка refresh
            токена'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера при обновлении токенов'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Обновление токенов
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя и автоматически выполняет вход
      parameters:
      - description: Registration data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: user registered and logged in successfully
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: User already exists
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'failed to register user / registered, but failed to login:
            Ошибка сервера при регистрации или авто-входе'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Регистрация пользователя
      tags:
      - auth
  /cart:
    get:
      description: Возвращает список товаров в корзине текущего пользователя
      produces:
      - application/json
      responses:
        "200":
          description: корзина успешно получена
          schema:
            $ref: '#/definitions/dto.CartResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Получить корзину
      tags:
      - cart
    post:
      consumes:
      - application/json
      description: Добавляет товар в корзину пользователя
      parameters:
      - description: Данные (product_id)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AddToCartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: статус операции
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'invalid request body / invalid product id / product is not
            active / cannot add own product to cart / product already in cart: Ошибка
            валидации или бизнес-логики'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Добавить в корзину
      tags:
      - cart
  /cart/{id}:
    delete:
      description: Удаляет товар из корзины пользователя по ID товара
      parameters:
      - description: ID продукта
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: статус операции
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'invalid product id / cart item not found: Некорректный ID
            или товар не найден в корзине'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Удалить из корзины
      tags:
      - cart
  /cart/checkout:
    post:
      description: Совершает покупку всех товаров из корзины и возвращает контакты
        продавцов
      produces:
      - application/json
      responses:
        "200":
          description: успешное оформление заказа
          schema:
            $ref: '#/definitions/dto.CheckoutResponse'
        "400":
          description: 'cart is empty / one or more products are no longer available:
            Ошибка оформления заказа'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Оформить заказ
      tags:
      - cart
  /profile:
    get:
      description: Возвращает данные профиля на основе userID из контекста (JWT)
      produces:
      - application/json
      responses:
        "200":
          description: профиль успешно получен
          schema:
            $ref: '#/definitions/models.User'
        "401":
          description: 'unauthorized: пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: внутренняя ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Получить профиль пользователя
      tags:
      - auth
  /profile/update:
    post:
      consumes:
      - application/json
      description: Обновляет имя пользователя. Требует действующую сессию и валидный
        CSRF-токен.
      parameters:
      - description: Новые данные профиля
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: профиль успешно обновлен
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: invalid request body / Missing CSRF cookie / CSRF token mismatch
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: missing token cookie / invalid token / token has been revoked
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: внутренняя ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      - CsrfHeaderAuth: []
      summary: Обновить профиль
      tags:
      - auth
  /users/{id}:
    get:
      description: 'Возвращает только общедоступную информацию: имя, рейтинг, кол-во
        объявлений. Не требует авторизации.'
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: публичный профиль успешно получен
          schema:
            $ref: '#/definitions/dto.PublicUserResponse'
        "400":
          description: invalid user id / user not found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: внутренняя ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получить публичный профиль
      tags:
      - auth
  /users/{id}/ads:
    get:
      description: Возвращает список всех объявлений продавца по его ID
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: объявления успешно получены
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/models.Ad'
              type: array
            type: object
        "400":
          description: некорректный ID пользователя
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить объявления пользователя
      tags:
      - ads
securityDefinitions:
  CookieAuth:
    description: JWT session token
    in: cookie
    name: token
    type: apiKey
  CsrfCookieAuth:
    description: CSRF token stored in cookies
    in: cookie
    name: csrf_token
    type: apiKey
  CsrfHeaderAuth:
    description: CSRF token required in header
    in: header
    name: X-CSRF-Token
    type: apiKey
swagger: "2.0"
