        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: invalid id / not author / not found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Удалить свой отзыв
      tags:
      - reviews
    put:
      consumes:
      - application/json
      parameters:
      - description: ID отзыва
        in: path
        name: id
        required: true
        type: integer
      - description: rating, content
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateReviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ReviewResponse'
        "400":
          description: validation / not author / not found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Обновить свой отзыв
      tags:
      - reviews
  /support/tickets:
    get:
      description: Возвращает список обращений текущего пользователя
      produces:
      - application/json
      responses:
        "200":
          description: список обращений получен
          schema:
            items:
              $ref: '#/definitions/dto.TicketResponse'
            type: array
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Мои обращения
      tags:
      - support
    post:
      consumes:
      - application/json
      description: Создаёт новое обращение в техподдержку
      parameters:
      - description: Данные обращения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateTicketRequest'
      produces:
      - application/json
      responses:
        "201":
          description: обращение успешно создано
          schema:
            $ref: '#/definitions/dto.TicketResponse'
        "400":
          description: 'bad request: Ошибка валидации или неверный JSON'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Создать обращение
      tags:
      - support
  /support/tickets/{id}:
    get:
      description: Возвращает детали одного обращения по ID
      parameters:
      - description: ID обращения
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: обращение получено
          schema:
            $ref: '#/definitions/dto.TicketResponse'
        "400":
          description: 'bad request: Некорректный ID'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: 'forbidden: Нет доступа к чужому обращению'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: 'not found: Обращение не найдено'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Получить обращение
      tags:
      - support
    put:
      consumes:
      - application/json
      description: Обновляет данные обращения (только в статусе open)
      parameters:
      - description: ID обращения
        in: path
        name: id
        required: true
        type: integer
      - description: Новые данные обращения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateTicketRequest'
      produces:
      - application/json
      responses:
        "200":
          description: обращение успешно обновлено
          schema:
            $ref: '#/definitions/dto.TicketResponse'
        "400":
          description: 'bad request: Ошибка валидации, неверный статус или JSON'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: 'forbidden: Нет доступа к чужому обращению'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: 'not found: Обращение не найдено'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Обновить обращение
      tags:
      - support
  /support/tickets/{id}/messages:
    get:
      description: |-
        Возвращает все сообщения чата обращения. Доступно автору обращения,
