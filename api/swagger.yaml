basePath: /api/v1
definitions:
  dto.AdPreview:
    properties:
      ad_id:
        type: integer
      photo:
        type: string
      price:
        type: integer
      status:
        type: string
      title:
        type: string
    type: object
  dto.AddToCartRequest:
    properties:
      product_id:
        type: integer
    type: object
  dto.CartItemResponse:
    properties:
      image_path:
        type: string
      price:
        type: integer
      product_id:
        type: integer
      seller_id:
        type: integer
      seller_name:
        type: string
      title:
        type: string
    type: object
  dto.CartResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.CartItemResponse'
        type: array
      total_price:
        type: integer
    type: object
  dto.ChangeStatusRequest:
    properties:
      status:
        type: string
    type: object
  dto.ChatDetailResponse:
    properties:
      ad:
        $ref: '#/definitions/dto.AdPreview'
      chat_id:
        type: integer
      messages:
        items:
          $ref: '#/definitions/dto.MessageItem'
        type: array
      partner:
        $ref: '#/definitions/dto.UserPreview'
    type: object
  dto.ChatListResponse:
    properties:
      chats:
        items:
          $ref: '#/definitions/dto.ChatPreview'
        type: array
    type: object
  dto.ChatPreview:
    properties:
      ad:
        $ref: '#/definitions/dto.AdPreview'
      chat_id:
        type: integer
      last_message:
        $ref: '#/definitions/dto.LastMessagePreview'
      partner:
        $ref: '#/definitions/dto.UserPreview'
    type: object
  dto.CreateTicketRequest:
    properties:
      category:
        type: string
      description:
        type: string
      title:
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  dto.LastMessagePreview:
    properties:
      created_at:
        type: string
      text:
        type: string
      type:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.LoginResponse:
    properties:
      email:
        type: string
      name:
        type: string
      role:
        type: string
      user_id:
        type: integer
    type: object
  dto.MessageItem:
    properties:
      created_at:
        type: string
      id:
        type: integer
      sender_id:
        type: integer
      text:
        type: string
      type:
        type: string
    type: object
  dto.MessageResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      text:
        type: string
      ticket_id:
        type: integer
      user_id:
        type: integer
    type: object
  dto.OrderResponse:
    properties:
      chat_id:
        type: integer
      message:
        type: string
    type: object
  dto.PublicUserResponse:
    properties:
      ads_count:
        type: integer
      avatar_path:
        type: string
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      rating:
        type: number
      reviews_count:
        type: integer
    type: object
  dto.RateTicketRequest:
    properties:
      rating:
        type: integer
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  dto.SendMessageRequest:
    properties:
      text:
        type: string
    type: object
  dto.StatsResponse:
    properties:
      by_category:
        additionalProperties:
          type: integer
        type: object
      by_status:
        additionalProperties:
          type: integer
        type: object
      total:
        type: integer
    type: object
  dto.SuccessConfirmOrderResponse:
    properties:
      message:
        type: string
    type: object
  dto.TicketResponse:
    properties:
      category:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      rating:
        type: integer
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  dto.TicketStatusResponse:
    properties:
      id:
        type: integer
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.UpdateProfileRequest:
    properties:
      name:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - name
    type: object
  dto.UpdateTicketRequest:
    properties:
      category:
        type: string
      description:
        type: string
      title:
        type: string
    type: object
  dto.UserPreview:
    properties:
      avatar_path:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  dto.ValidationErrors:
    properties:
      category_characteristics:
        type: string
      category_id:
        type: string
      custom_characteristics:
        type: string
      description:
        type: string
      email:
        type: string
      location:
        type: string
      name:
        type: string
      password:
        type: string
      photos:
        items:
          type: string
        type: array
      price:
        type: string
      status:
        type: string
      title:
        type: string
      user_id:
        type: string
    type: object
  models.Ad:
    properties:
      category_characteristics:
        items:
          $ref: '#/definitions/models.ProductCharacteristic'
        type: array
      category_id:
        type: integer
      created_at:
        type: string
      custom_characteristics:
        items:
          $ref: '#/definitions/models.ProductCustomCharacteristic'
        type: array
      deleted_at:
        type: string
      description:
        type: string
      favorites_count:
        type: integer
      id:
        type: integer
      location:
        type: string
      photos:
        items:
          type: string
        type: array
      price:
        type: integer
      seller_id:
        type: integer
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
      views_count:
        type: integer
    type: object
  models.CategoryCharacteristic:
    properties:
      allowed_values:
        description: nil = свободный ввод
        items:
          type: string
        type: array
      category_id:
        type: integer
      id:
        type: integer
      name:
        type: string
      sort_order:
        type: integer
    type: object
  models.ProductCharacteristic:
    properties:
      name:
        type: string
      value:
        type: string
    type: object
  models.ProductCustomCharacteristic:
    properties:
      name:
        type: string
      value:
        type: string
    type: object
  models.User:
    properties:
      ads_count:
        type: integer
      avatar_path:
        type: string
      cart_count:
        type: integer
      created_at:
        type: string
      email:
        type: string
      favorites_count:
        type: integer
      id:
        type: integer
      name:
        type: string
      rating:
        type: number
      reviews_count:
        type: integer
      role:
        type: string
      unread_messages_count:
        type: integer
      updated_at:
        type: string
    type: object
host: clover-go.ru
info:
  contact: {}
  description: API for the Clover service.
  title: Clover API
  version: "1.0"
paths:
  /ads:
    get:
      description: Возвращает список всех объявлений
      produces:
      - application/json
      responses:
        "200":
          description: список объявлений успешно получен
          schema:
            items:
              $ref: '#/definitions/models.Ad'
            type: array
        "400":
          description: 'Method not allowed: Метод не поддерживается (ожидается GET)'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера при получении объявлений'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получить список объявлений
      tags:
      - ads
    post:
      consumes:
      - multipart/form-data
      description: Создает новое объявление с фотографиями через multipart/form-data.
        Доступно только авторизованным пользователям.
      parameters:
      - description: JSON с данными объявления (title, description, price, category_id,
          status, location)
        in: formData
        name: data
        required: true
        type: string
      - description: Фотографии объявления (можно несколько)
        in: formData
        name: photos
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: ID созданного объявления
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
        "400":
          description: invalid request body / ошибки валидации
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Создать объявление
      tags:
      - ads
  /ads/{id}:
    delete:
      description: Мягкое удаление объявления. Доступно только владельцу.
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: объявление успешно удалено
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'ad not found: Объявление не найдено или не принадлежит пользователю'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Удалить объявление
      tags:
      - ads
    get:
      description: Возвращает объявление по заданному ID
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: объявление успешно получено
          schema:
            $ref: '#/definitions/models.Ad'
        "400":
          description: 'ad not found: Объявление не найдено'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера при получении объявления'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получить объявление по ID
      tags:
      - ads
    put:
      consumes:
      - multipart/form-data
      description: Обновляет объявление по заданному ID с возможностью замены фотографий
        через multipart/form-data. Доступно только владельцу.
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: integer
      - description: JSON с данными для обновления (title, description, price, category_id,
          status, location)
        in: formData
        name: data
        required: true
        type: string
      - description: Новые фотографии объявления (заменяют старые)
        in: formData
        name: photos
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: объявление успешно обновлено
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'ad not found: Объявление не найдено или не принадлежит пользователю'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Обновить объявление
      tags:
      - ads
  /ads/{id}/close:
    post:
      description: Устанавливает статус объявления в 'archived'. Доступно только владельцу.
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "0":
          description: 'ad not found: Объявление не найдено, уже архивировано или
            не принадлежит пользователю'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "200":
          description: объявление успешно архивировано
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'invalid ad id: Некорректный ID'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Закрыть объявление
      tags:
      - ads
  /ads/{id}/favorite:
    delete:
      description: Удаляет объявление из списка избранного текущего пользователя
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: статус операции
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'invalid ad id: Некорректный ID'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Удалить из избранного
      tags:
      - favorites
    post:
      description: Добавляет объявление в список избранного текущего пользователя
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: статус операции
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'invalid ad id: Некорректный ID'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Добавить в избранное
      tags:
      - favorites
  /ads/{id}/order:
    post:
      consumes:
      - application/json
      description: |-
        Создаёт (или переиспользует существующий) чат между покупателем
        и продавцом по объявлению и отправляет туда сообщение-заказ.
        В ответе возвращается ID чата для редиректа на фронте.
      parameters:
      - description: ID объявления (ad_id)
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: запрос на покупку создан успешно
          schema:
            $ref: '#/definitions/dto.OrderResponse'
        "400":
          description: invalid ad id
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - Bearer: []
      summary: Создать запрос на покупку товара
      tags:
      - orders
  /ads/{id}/view:
    post:
      description: Записывает просмотр с дедупликацией и возвращает актуальный счётчик
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: integer
      - description: UUID v4 идентификатор устройства
        in: header
        name: X-Device-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: views_count
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
        "400":
          description: invalid ad id / invalid X-Device-ID
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: ad not found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Зафиксировать просмотр объявления
      tags:
      - ads
  /ads/search:
    get:
      description: Поиск объявлений по заголовку и описанию с поддержкой триграмм,
        транслитерации и смены раскладки
      parameters:
      - description: Поисковый запрос
        in: query
        name: query
        required: true
        type: string
      - description: ID категории (фильтр)
        in: query
        name: category_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: результаты поиска
          schema:
            items:
              $ref: '#/definitions/models.Ad'
            type: array
        "400":
          description: query parameter is required / search query is too short
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Поиск объявлений
      tags:
      - ads
  /auth/login:
    post:
      consumes:
      - application/json
      description: Аутентифицирует пользователя по email/пароль или, при наличии cookie,
        проверяет токен
      parameters:
      - description: Login credentials
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: login successful
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: 'invalid request body: Неверный формат тела запроса'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'invalid credentials / invalid or expired token / email/password
            is required (ValidationErrors): Ошибка аутентификации или невалидный токен'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'failed to login: Ошибка сервера при входе'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Вход пользователя
      tags:
      - auth
  /auth/logout:
    post:
      description: Инвалидирует текущую сессию и очищает аутентификационную куку
      responses:
        "200":
          description: logout successful
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'Missing CSRF cookie / CSRF token mismatch: Ошибка CSRF'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'missing token cookie / invalid token / token has been revoked:
            Ошибка авторизации (Middleware) или internal error: Отсутствует jti'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'failed to logout: Ошибка сервера при выходе'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Выход пользователя
      tags:
      - auth
  /auth/refresh:
    post:
      description: Получает новый access и rottates refresh token
      produces:
      - application/json
      responses:
        "200":
          description: tokens refreshed
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'refresh token required / invalid refresh token: Ошибка refresh
            токена'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера при обновлении токенов'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Обновление токенов
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя и автоматически выполняет вход
      parameters:
      - description: Registration data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: user registered and logged in successfully
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: User already exists
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'failed to register user / registered, but failed to login:
            Ошибка сервера при регистрации или авто-входе'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Регистрация пользователя
      tags:
      - auth
  /cart:
    get:
      description: Возвращает список товаров в корзине текущего пользователя
      produces:
      - application/json
      responses:
        "200":
          description: корзина успешно получена
          schema:
            $ref: '#/definitions/dto.CartResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Получить корзину
      tags:
      - cart
    post:
      consumes:
      - application/json
      description: Добавляет товар в корзину пользователя
      parameters:
      - description: Данные (product_id)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AddToCartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: статус операции
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'invalid request body / invalid product id / product is not
            active / cannot add own product to cart / product already in cart: Ошибка
            валидации или бизнес-логики'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Добавить в корзину
      tags:
      - cart
  /cart/{id}:
    delete:
      description: Удаляет товар из корзины пользователя по ID товара
      parameters:
      - description: ID продукта
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: статус операции
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'invalid product id / cart item not found: Некорректный ID
            или товар не найден в корзине'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Удалить из корзины
      tags:
      - cart
  /categories/{id}/characteristics:
    get:
      description: Возвращает список предопределённых характеристик категории с допустимыми
        значениями
      parameters:
      - description: ID категории
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: список характеристик
          schema:
            items:
              $ref: '#/definitions/models.CategoryCharacteristic'
            type: array
        "400":
          description: invalid category id
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получить характеристики категории
      tags:
      - categories
  /chats:
    get:
      description: |-
        Возвращает чаты, в которых участвует текущий пользователь,
        отсортированные по времени последнего сообщения.
      produces:
      - application/json
      responses:
        "200":
          description: список чатов
          schema:
            $ref: '#/definitions/dto.ChatListResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - Bearer: []
      summary: Получить список чатов
      tags:
      - chats
  /chats/{id}:
    get:
      description: |-
        Возвращает объявление, собеседника и все сообщения чата.
        Доступ только у участников чата — для остальных 400.
      parameters:
      - description: ID чата
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: детали чата
          schema:
            $ref: '#/definitions/dto.ChatDetailResponse'
        "400":
          description: chat not found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - Bearer: []
      summary: Получить чат
      tags:
      - chats
  /chats/{id}/confirm:
    post:
      consumes:
      - application/json
      description: |-
        Продавец подтверждает сделку по чату. Создаётся заказ за покупателем,
        объявление переводится в статус 'sold' и удаляется из корзин всех пользователей.
      parameters:
      - description: ID чата
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: покупка подтверждена успешно
          schema:
            $ref: '#/definitions/dto.SuccessConfirmOrderResponse'
        "400":
          description: 'invalid chat id / forbidden: not the seller / ad is not active'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - Bearer: []
      summary: Подтвердить покупку товара
      tags:
      - orders
  /profile:
    get:
      description: Возвращает данные профиля на основе userID из контекста (JWT)
      produces:
      - application/json
      responses:
        "200":
          description: профиль успешно получен
          schema:
            $ref: '#/definitions/models.User'
        "401":
          description: 'unauthorized: пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: внутренняя ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Получить профиль пользователя
      tags:
      - auth
  /profile/avatar:
    post:
      consumes:
      - multipart/form-data
      description: 'Принимает файл через multipart/form-data. Поле: "avatar"'
      parameters:
      - description: Файл изображения
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: аватар обновлен
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: file too big / failed to get file
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: внутренняя ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Загрузить аватар
      tags:
      - auth
  /profile/favorites:
    get:
      description: Возвращает список всех объявлений, добавленных текущим пользователем
        в избранное
      produces:
      - application/json
      responses:
        "200":
          description: список избранных объявлений
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/models.Ad'
              type: array
            type: object
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Получить избранное
      tags:
      - favorites
  /profile/update:
    post:
      consumes:
      - application/json
      description: Обновляет имя пользователя. Требует действующую сессию и валидный
        CSRF-токен.
      parameters:
      - description: Новые данные профиля
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: профиль успешно обновлен
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: invalid request body / Missing CSRF cookie / CSRF token mismatch
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: missing token cookie / invalid token / token has been revoked
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: внутренняя ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      - CsrfHeaderAuth: []
      summary: Обновить профиль
      tags:
      - auth
  /support/tickets:
    get:
      description: Возвращает список обращений текущего пользователя
      produces:
      - application/json
      responses:
        "200":
          description: список обращений получен
          schema:
            items:
              $ref: '#/definitions/dto.TicketResponse'
            type: array
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Мои обращения
      tags:
      - support
    post:
      consumes:
      - application/json
      description: Создаёт новое обращение в техподдержку
      parameters:
      - description: Данные обращения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateTicketRequest'
      produces:
      - application/json
      responses:
        "201":
          description: обращение успешно создано
          schema:
            $ref: '#/definitions/dto.TicketResponse'
        "400":
          description: 'bad request: Ошибка валидации или неверный JSON'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Создать обращение
      tags:
      - support
  /support/tickets/{id}:
    get:
      description: Возвращает детали одного обращения по ID
      parameters:
      - description: ID обращения
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: обращение получено
          schema:
            $ref: '#/definitions/dto.TicketResponse'
        "400":
          description: 'bad request: Некорректный ID'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: 'forbidden: Нет доступа к чужому обращению'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: 'not found: Обращение не найдено'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Получить обращение
      tags:
      - support
    put:
      consumes:
      - application/json
      description: Обновляет данные обращения (только в статусе open)
      parameters:
      - description: ID обращения
        in: path
        name: id
        required: true
        type: integer
      - description: Новые данные обращения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateTicketRequest'
      produces:
      - application/json
      responses:
        "200":
          description: обращение успешно обновлено
          schema:
            $ref: '#/definitions/dto.TicketResponse'
        "400":
          description: 'bad request: Ошибка валидации, неверный статус или JSON'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: 'forbidden: Нет доступа к чужому обращению'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: 'not found: Обращение не найдено'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Обновить обращение
      tags:
      - support
  /support/tickets/{id}/messages:
    get:
      description: |-
        Возвращает все сообщения чата обращения. Доступно автору обращения,
        а также пользователям с ролью support/admin.
      parameters:
      - description: ID обращения
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: список сообщений
          schema:
            items:
              $ref: '#/definitions/dto.MessageResponse'
            type: array
        "400":
          description: 'bad request: неверный ID или нет доступа'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Получить сообщения обращения
      tags:
      - support
    post:
      consumes:
      - application/json
      description: |-
        Отправляет сообщение в чат обращения. Доступно автору обращения,
        а также пользователям с ролью support/admin.
      parameters:
      - description: ID обращения
        in: path
        name: id
        required: true
        type: integer
      - description: Текст сообщения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SendMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: сообщение отправлено
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: 'bad request: пустой текст, неверный ID или нет доступа'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Отправить сообщение в чат обращения
      tags:
      - support
  /support/tickets/{id}/rate:
    post:
      consumes:
      - application/json
      description: Позволяет автору обращения выставить оценку от 1 до 5 для закрытого
        тикета
      parameters:
      - description: ID обращения
        in: path
        name: id
        required: true
        type: integer
      - description: Оценка
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RateTicketRequest'
      produces:
      - application/json
      responses:
        "200":
          description: оценка выставлена
          schema:
            $ref: '#/definitions/dto.TicketResponse'
        "400":
          description: 'bad request: Некорректная оценка, тикет не закрыт или уже
            оценён'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: 'forbidden: Пользователь не является автором'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: 'not found: Обращение не найдено'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Оценить обращение
      tags:
      - support
  /support/tickets/{id}/status:
    patch:
      consumes:
      - application/json
      description: |-
        Меняет статус обращения. Доступно только пользователям с ролью support/admin.
        Допустимые статусы: open, in_progress, closed.
      parameters:
      - description: ID обращения
        in: path
        name: id
        required: true
        type: integer
      - description: Новый статус
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ChangeStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: статус обновлён
          schema:
            $ref: '#/definitions/dto.TicketStatusResponse'
        "400":
          description: 'bad request: неверный ID, статус или обращение не найдено'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Сменить статус обращения
      tags:
      - support
  /support/tickets/all:
    get:
      description: |-
        Возвращает список всех обращений всех пользователей.
        Доступно только пользователям с ролью support/admin.
      produces:
      - application/json
      responses:
        "200":
          description: список обращений
          schema:
            items:
              $ref: '#/definitions/dto.TicketResponse'
            type: array
        "401":
          description: 'unauthorized: пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Все обращения
      tags:
      - support
  /support/tickets/stats:
    get:
      description: |-
        Возвращает сводную статистику по обращениям: общее количество,
        разбивку по статусу и категории. Доступно только support/admin.
      produces:
      - application/json
      responses:
        "200":
          description: статистика обращений
          schema:
            $ref: '#/definitions/dto.StatsResponse'
        "401":
          description: 'unauthorized: пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Статистика обращений
      tags:
      - support
  /users/{id}:
    get:
      description: 'Возвращает только общедоступную информацию: имя, рейтинг, кол-во
        объявлений. Не требует авторизации.'
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: публичный профиль успешно получен
          schema:
            $ref: '#/definitions/dto.PublicUserResponse'
        "400":
          description: invalid user id / user not found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: внутренняя ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получить публичный профиль
      tags:
      - auth
  /users/{id}/ads:
    get:
      description: Возвращает список всех объявлений продавца по его ID
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: объявления успешно получены
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/models.Ad'
              type: array
            type: object
        "400":
          description: некорректный ID пользователя
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить объявления пользователя
      tags:
      - ads
securityDefinitions:
  CookieAuth:
    description: JWT session token
    in: cookie
    name: token
    type: apiKey
  CsrfCookieAuth:
    description: CSRF token stored in cookies
    in: cookie
    name: csrf_token
    type: apiKey
  CsrfHeaderAuth:
    description: CSRF token required in header
    in: header
    name: X-CSRF-Token
    type: apiKey
swagger: "2.0"
