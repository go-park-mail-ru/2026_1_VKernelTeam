host: clover-go.ru
info:
  contact: {}
  description: |-
    API маркетплейса Клевер (микросервисная архитектура).
    - Auth Service       (HTTP :8001, gRPC :9001) — авторизация, профиль, пользователи
    - Support Service    (HTTP :8002)             — техподдержка
    - Catalog Service    (HTTP :8004, gRPC :9004) — объявления, категории, избранное, просмотры
    - Commerce Service   (HTTP :8006)             — корзина, чаты, заказы
    Все запросы идут через API Gateway (nginx :8080).
  title: Clover API
  version: "1.0"
paths:
  /admin/moderation/ads/{id}/approve:
    post:
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Одобрить объявление
      tags:
      - admin
  /admin/moderation/ads/{id}/reject:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: integer
      - description: причина отказа
        in: body
        name: body
        schema:
          $ref: '#/definitions/handlers.rejectBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - CookieAuth: []
      summary: Отклонить объявление
      tags:
      - admin
  /admin/moderation/queue:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/models.Ad'
              type: array
            type: object
      security:
      - CookieAuth: []
      summary: Список объявлений на модерации
      tags:
      - admin
  /admin/moderation/settings:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      security:
      - CookieAuth: []
      summary: Текущее состояние модерации
      tags:
      - admin
    put:
      consumes:
      - application/json
      parameters:
      - description: флаг
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.moderationFlagBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      security:
      - CookieAuth: []
      summary: Включить/выключить модерацию
      tags:
      - admin
  /ads:
    get:
      description: Возвращает список всех объявлений
      produces:
      - application/json
      responses:
        "200":
          description: список объявлений успешно получен
          schema:
            items:
              $ref: '#/definitions/models.Ad'
            type: array
        "400":
          description: 'Method not allowed: Метод не поддерживается (ожидается GET)'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера при получении объявлений'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получить список объявлений
      tags:
      - ads
    post:
      consumes:
      - multipart/form-data
      description: Создает новое объявление с фотографиями через multipart/form-data.
        Доступно только авторизованным пользователям.
      parameters:
      - description: JSON с данными объявления (title, description, price, category_id,
          status, location, lat, lon)
        in: formData
        name: data
        required: true
        type: string
      - description: Фотографии объявления (можно несколько)
        in: formData
        name: photos
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: ID созданного объявления
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
        "400":
          description: invalid request body / ошибки валидации
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Создать объявление
      tags:
      - ads
  /ads/{id}:
    delete:
      description: Мягкое удаление объявления. Доступно только владельцу.
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: объявление успешно удалено
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'ad not found: Объявление не найдено или не принадлежит пользователю'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Удалить объявление
      tags:
      - ads
    get:
      description: Возвращает объявление по заданному ID
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: объявление успешно получено
          schema:
            $ref: '#/definitions/models.Ad'
        "400":
          description: 'ad not found: Объявление не найдено'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера при получении объявления'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получить объявление по ID
      tags:
      - ads
    put:
      consumes:
      - multipart/form-data
      description: Обновляет объявление по заданному ID с возможностью замены фотографий
        через multipart/form-data. Доступно только владельцу.
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: integer
      - description: JSON с данными для обновления (title, description, price, category_id,
          status, location, lat, lon)
        in: formData
        name: data
        required: true
        type: string
      - description: Новые фотографии объявления (заменяют старые)
        in: formData
        name: photos
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: объявление успешно обновлено
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'ad not found: Объявление не найдено или не принадлежит пользователю'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Обновить объявление
      tags:
      - ads
  /ads/{id}/admin:
    delete:
      description: 'Жёсткое удаление от имени админа: товар становится недоступен
        и'
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: status=deleted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid ad id
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: unauthorized / forbidden role
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: ad not found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Удалить объявление (админ)
      tags:
      - admin
  /ads/{id}/close:
    post:
      description: Устанавливает статус объявления в 'archived'. Доступно только владельцу.
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "0":
          description: 'ad not found: Объявление не найдено, уже архивировано или
            не принадлежит пользователю'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "200":
          description: объявление успешно архивировано
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'invalid ad id: Некорректный ID'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Закрыть объявление
      tags:
      - ads
  /ads/{id}/favorite:
    delete:
      description: Удаляет объявление из списка избранного текущего пользователя
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: статус операции
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'invalid ad id: Некорректный ID'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 'internal error: Ошибка сервера'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Удалить из избранного
      tags:
      - favorites
    post:
      description: Добавляет объявление в список избранного текущего пользователя
      parameters:
      - description: ID объявления
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: статус операции
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'invalid ad id: Некорректный ID'
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 'unauthorized: Пользователь не авторизован'
          schema:
