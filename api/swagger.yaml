  /test/reset:
    post:
      description: Удаляет объявления, корзину, избранное, чаты, отзывы, тикеты, кошелёк
        и сбрасывает аватар/рейтинг. Аккаунт остаётся. Доступно только email с префиксом
        "clover-tester".
