securityDefinitions:
  CookieAuth:
    description: JWT session token
    in: cookie
    name: token
    type: apiKey
  CsrfCookieAuth:
    description: CSRF token stored in cookies
    in: cookie
    name: csrf_token
    type: apiKey
  CsrfHeaderAuth:
    description: CSRF token required in header
    in: header
    name: X-CSRF-Token
    type: apiKey
swagger: "2.0"
